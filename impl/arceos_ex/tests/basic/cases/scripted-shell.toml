schema_version = 2
name = "scripted-shell"
purpose = "acceptance"
timeout_seconds = 120

[kernel]
app = "user-boot"
provider = "native"
probe = []
profile = "release"

[disk]
mode = "template-readonly"
profile = "canonical"

[qemu]
memory_mb = 128
smp = 8
kernel_cmdline = "earlycon=sbi init=/bin/sh"
rng = true
exit_policy = "guest-shutdown"
interaction = "scripted"
stdin_steps = [
  { ready_marker = "~ #", payload = "echo \"OK\"\nls\nls /lib\nls /\nexit\n" },
]

[expect]
process_exit = 0
guest_exit_status = 0
forbidden_markers = ["Function not implemented", "arceos_ex panic"]
marker_counts = [
  { marker = "\nOK\n", exactly = 1 },
  { marker = "ld-musl-riscv64.so.1", exactly = 1 },
  { marker = "lost+found", exactly = 2 },
]

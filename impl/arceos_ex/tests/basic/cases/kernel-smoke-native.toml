schema_version = 2
name = "kernel-smoke-native"
purpose = "acceptance"
timeout_seconds = 120

[kernel]
app = "smoke"
provider = "native"
probe = []
profile = "release"

[disk]
mode = "template-readonly"
profile = "canonical"

[qemu]
memory_mb = 128
smp = 8
kernel_cmdline = "earlycon=sbi"
rng = true
exit_policy = "guest-shutdown"
interaction = "none"

[expect]
process_exit = 0
markers = ["result:", " failed=0 total="]
forbidden_markers = ["FAILED", "arceos_ex panic"]

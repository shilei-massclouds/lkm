schema_version = 2
name = "rc-local-linux"
purpose = "diagnostic"
timeout_seconds = 360

[kernel]
target = "linux"

[disk]
mode = "private-copy"
profile = "canonical"

[qemu]
memory_mb = 128
smp = 2
kernel_cmdline = "earlycon=sbi root=/dev/vda rw console=ttyS0 init=/opt/lkm/tests/rc-local-init"
rng = false
user_network = true
host_forwards = [
  { protocol = "tcp", host_port = 5555, guest_port = 5555 },
]
exit_policy = "stress-mem"
interaction = "none"

[expect]
markers = [
  "lkm-rc-local: begin",
  "lost+found",
  "lkm-rc-local: end status=0",
  "SyscallTable.Wait4",
  "scheduler_diff_summary: total=",
  "scheduler_diff: seq=0 stage=entry cpu=0 mode=0 prev=0 next=-1 prev_state=0 prev_on_rq=1 flags=0 class=none",
  "scheduler_diff: seq=1 stage=prepare_prev cpu=0 mode=0 prev=0 next=-1 prev_state=0 prev_on_rq=1 flags=0 class=none",
  "scheduler_diff: seq=2 stage=pick_next cpu=0 mode=0 prev=0 next=1 prev_state=0 prev_on_rq=1 flags=0 class=fair",
  "scheduler_diff: seq=3 stage=switch_entry cpu=0 mode=0 prev=0 next=1 prev_state=0 prev_on_rq=1 flags=0 class=fair",
  "scheduler_diff: seq=4 stage=finish_return cpu=0 mode=-128 prev=0 next=1 prev_state=0 prev_on_rq=1 flags=0 class=fair",
]
forbidden_markers = ["lkm-rc-local-init: execve failed", "overflow=1", "Kernel panic"]

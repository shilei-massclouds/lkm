schema_version = 1
name = "distro-ls-native"
timeout_seconds = 120

[kernel]
app = "user-boot"
provider = "native"
probe = []
profile = "release"

[disk]
mode = "canonical-readonly"

[qemu]
memory_mb = 128
smp = 8
kernel_cmdline = "earlycon=sbi init=/bin/ls"
rng = true
exit_policy = "guest-shutdown"

[expect]
process_exit = 0
guest_exit_status = 0
markers = ["lost+found"]
forbidden_markers = ["Function not implemented", "arceos_ex panic"]

schema_version = 2
name = "kernel-smoke-stress-mem"
purpose = "acceptance"
timeout_seconds = 120

[kernel]
app = "smoke"
provider = "native"
probe = ["stress-mem"]
profile = "release"
stress_mem_bytes = 65536

[disk]
mode = "template-readonly"
profile = "canonical"

[qemu]
memory_mb = 128
smp = 8
kernel_cmdline = "earlycon=sbi"
rng = true
exit_policy = "stress-mem"
interaction = "none"

[expect]
markers = ["result:", " failed=0 total="]
forbidden_markers = ["FAILED", "overflow=1", "arceos_ex panic"]

schema_version = 2
name = "ltp-lo"
purpose = "acceptance"
timeout_seconds = 300

[kernel]
app = "user-boot"
provider = "linux-object"
probe = ["user-syscall-trace", "user-syscall-error"]
profile = "release"

[disk]
mode = "private-copy"
profile = "canonical"

[qemu]
memory_mb = 128
smp = 8
kernel_cmdline = "earlycon=sbi init=/bin/sh"
rng = true
exit_policy = "marker"
exit_marker = "lkm-ltp: complete"
interaction = "scripted"
stdin_steps = [
  { ready_marker = "~ #", payload = "/opt/lkm/tests/ltp-init.sh supported\n" },
]

[expect]
forbidden_markers = ["unsupported syscall", "Function not implemented", "ENOSYS", "TFAIL", "TBROK", "TWARN", "TCONF", ": FAIL (", ": BROK (", ": WARN (", ": CONF (", "arceos_ex panic", "Kernel panic"]
marker_counts = [
  { marker = "--- uname01: PASS (exit 0)", exactly = 1 },
  { marker = "--- uname02: PASS (exit 0)", exactly = 1 },
  { marker = "--- getuid01: PASS (exit 0)", exactly = 1 },
  { marker = "--- geteuid01: PASS (exit 0)", exactly = 1 },
  { marker = "Summary: TOTAL=4 PASS=4 FAIL=0 BROK=0 WARN=0 CONF=0", exactly = 1 },
  { marker = "lkm-ltp: selection=supported status=0", exactly = 1 },
  { marker = "lkm-ltp: complete", exactly = 1 },
]

schema_version = 2
name = "checkpoint-kunit-linux-object"
purpose = "acceptance"
timeout_seconds = 120

[kernel]
app = "hello"
provider = "linux-object"
probe = []
probe_file = "impl/arceos_ex/tests/kunit.handlers"
profile = "release"

[disk]
mode = "template-readonly"
profile = "canonical"

[qemu]
memory_mb = 128
smp = 8
kernel_cmdline = "earlycon=sbi"
rng = true
exit_policy = "guest-shutdown"
interaction = "none"

[expect]
process_exit = 0
markers = ["KTAP version 1", "ok 1 arceos_ex"]
forbidden_markers = ["not ok 1", "arceos_ex panic"]

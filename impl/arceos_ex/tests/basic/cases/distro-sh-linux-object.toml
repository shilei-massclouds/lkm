schema_version = 1
name = "distro-sh-linux-object"
timeout_seconds = 120

[kernel]
app = "user-boot"
provider = "linux-object"
probe = []
profile = "release"

[disk]
mode = "canonical-readonly"

[qemu]
memory_mb = 128
smp = 8
kernel_cmdline = "earlycon=sbi init=/bin/sh"
rng = true
exit_policy = "guest-shutdown"
stdin_steps = [
  { ready_marker = "~ #", payload = "/bin/ls\n/bin/ls\nexit\n" },
]

[expect]
process_exit = 0
guest_exit_status = 0
forbidden_markers = ["Function not implemented", "arceos_ex panic"]
marker_counts = [
  { marker = "lost+found", at_least = 2 },
]

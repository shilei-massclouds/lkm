schema_version = 2
name = "hello-native"
purpose = "acceptance"
timeout_seconds = 120

[kernel]
app = "hello"
provider = "native"
probe = ["announce"]
profile = "release"

[disk]
mode = "template-readonly"
profile = "canonical"

[qemu]
memory_mb = 128
smp = 8
kernel_cmdline = "earlycon=sbi"
rng = true
exit_policy = "guest-shutdown"
interaction = "none"

[expect]
process_exit = 0
markers = ["Hello, world!"]
forbidden_markers = ["arceos_ex initcall event failed", "arceos_ex panic"]
marker_counts = [
  { marker = "checkpoint: Kernel.Online", exactly = 1 },
]

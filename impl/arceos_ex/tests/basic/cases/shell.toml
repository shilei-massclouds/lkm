schema_version = 2
name = "shell"
purpose = "diagnostic"
timeout_seconds = 3600

[kernel]
app = "user-boot"
provider = "native"
probe = []
profile = "release"

[disk]
mode = "private-copy"
profile = "canonical"

[qemu]
memory_mb = 128
smp = 8
kernel_cmdline = "earlycon=sbi init=/bin/sh"
rng = true
exit_policy = "guest-shutdown"
interaction = "terminal"

[expect]
process_exit = 0
forbidden_markers = ["arceos_ex panic"]

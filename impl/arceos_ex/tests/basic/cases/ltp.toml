schema_version = 2
name = "ltp"
purpose = "acceptance"
timeout_seconds = 180

[kernel]
app = "user-boot"
provider = "native"
probe = []
profile = "release"

[disk]
mode = "private-copy"
profile = "canonical"

[qemu]
memory_mb = 128
smp = 8
kernel_cmdline = "earlycon=sbi init=/bin/sh"
rng = true
exit_policy = "guest-shutdown"
interaction = "scripted"
stdin_steps = [
  { ready_marker = "~ #", payload = "cd /opt/ltp || exit $?\n" },
  { ready_marker = "/opt/ltp #", payload = "./run-syscalls.sh --list -- 'close*'\nstatus=$?\nexit \"$status\"\n" },
]

[expect]
process_exit = 0
guest_exit_status = 0
forbidden_markers = ["unsupported syscall", "Function not implemented", "ENOSYS", "TFAIL", "TBROK", "TWARN", "TCONF", "arceos_ex panic"]
marker_counts = [
  { marker = "close01\tclose01", exactly = 1 },
  { marker = "close02\tclose02", exactly = 1 },
]

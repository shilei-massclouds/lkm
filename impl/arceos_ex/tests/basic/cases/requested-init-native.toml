schema_version = 2
name = "requested-init-native"
purpose = "acceptance"
timeout_seconds = 120

[kernel]
app = "user-boot"
provider = "native"
probe = []
profile = "release"

[disk]
mode = "template-readonly"
profile = "canonical"

[qemu]
memory_mb = 128
smp = 8
kernel_cmdline = "earlycon=sbi init=/opt/lkm/tests/init-hello"
rng = true
exit_policy = "guest-shutdown"
interaction = "none"

[expect]
process_exit = 0
guest_exit_status = 0
markers = ["user hello"]
forbidden_markers = ["Function not implemented", "arceos_ex panic"]

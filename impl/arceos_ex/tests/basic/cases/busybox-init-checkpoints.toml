schema_version = 2
name = "busybox-init-checkpoints"
purpose = "diagnostic"
timeout_seconds = 180

[kernel]
app = "user-boot"
provider = "native"
probe = ["announce", "stress-mem"]
profile = "release"
stress_mem_bytes = 524288

[disk]
mode = "private-copy"
profile = "canonical"

[qemu]
memory_mb = 128
smp = 2
kernel_cmdline = "earlycon=sbi init=/sbin/init"
rng = true
exit_policy = "stress-mem"
interaction = "scripted"
stdin_steps = [
  { ready_marker = "login:", payload = "test\n" },
  { ready_marker = "Password:", payload = "test\n" },
  { ready_marker = "~$", payload = "/bin/ls\nexit\n" },
]

[expect]
markers = ["SyscallTable.Wait4", "login:", "~$", "lost+found"]
forbidden_markers = ["can't run '/sbin/openrc'", "overflow=1", "Function not implemented", "arceos_ex panic"]

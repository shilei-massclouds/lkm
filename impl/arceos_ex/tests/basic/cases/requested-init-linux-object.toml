schema_version = 1
name = "requested-init-linux-object"
timeout_seconds = 120

[kernel]
app = "user-boot"
provider = "linux-object"
probe = []
profile = "release"

[disk]
mode = "canonical-readonly"

[qemu]
memory_mb = 128
smp = 8
kernel_cmdline = "earlycon=sbi init=/opt/lkm/tests/init-hello"
rng = true
exit_policy = "guest-shutdown"

[expect]
process_exit = 0
guest_exit_status = 0
markers = ["user hello"]
forbidden_markers = ["Function not implemented", "arceos_ex panic"]

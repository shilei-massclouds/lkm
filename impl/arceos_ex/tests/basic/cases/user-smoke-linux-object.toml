schema_version = 2
name = "user-smoke-linux-object"
purpose = "acceptance"
timeout_seconds = 120

[kernel]
app = "user-boot"
provider = "linux-object"
probe = []
profile = "release"

[disk]
mode = "private-copy"
profile = "canonical"

[qemu]
memory_mb = 128
smp = 8
kernel_cmdline = "earlycon=sbi init=/opt/lkm/tests/user-smoke"
rng = true
exit_policy = "guest-shutdown"
interaction = "none"

[expect]
process_exit = 0
guest_exit_status = 0
markers = ["user-smoke: begin", "user fork child private mm ok", "user fork parent COW unique fast path ok", "user fork COW reuse stress ok", "user-smoke: end status=0"]
forbidden_markers = ["Function not implemented", "arceos_ex panic"]

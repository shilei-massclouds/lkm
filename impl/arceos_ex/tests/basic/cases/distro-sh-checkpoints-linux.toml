schema_version = 2
name = "distro-sh-checkpoints-linux"
purpose = "diagnostic"
timeout_seconds = 360

[kernel]
target = "linux"

[disk]
mode = "private-copy"
profile = "canonical"

[qemu]
memory_mb = 128
smp = 2
kernel_cmdline = "earlycon=sbi root=/dev/vda rw console=ttyS0 init=/bin/sh"
rng = false
user_network = true
host_forwards = [
  { protocol = "tcp", host_port = 5555, guest_port = 5555 },
]
exit_policy = "stress-mem"
interaction = "scripted"
stdin_steps = [
  { ready_marker = "~ #", payload = "/bin/ls\n/bin/ls\n/sbin/poweroff -f\n" },
]

[expect]
markers = ["PayloadPhase.Online"]
forbidden_markers = ["overflow=1", "Kernel panic"]
marker_counts = [
  { marker = "lost+found", at_least = 2 },
]

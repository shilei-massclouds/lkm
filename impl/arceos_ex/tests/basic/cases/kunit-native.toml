schema_version = 1
name = "kunit-native"
timeout_seconds = 120

[kernel]
app = "hello"
provider = "native"
probe = []
probe_file = "impl/arceos_ex/tests/kunit.handlers"
profile = "release"

[disk]
mode = "canonical-readonly"

[qemu]
memory_mb = 128
smp = 8
kernel_cmdline = "earlycon=sbi"
rng = true
exit_policy = "guest-shutdown"

[expect]
process_exit = 0
markers = ["KTAP version 1", "ok 1 arceos_ex"]
forbidden_markers = ["not ok 1", "arceos_ex panic"]

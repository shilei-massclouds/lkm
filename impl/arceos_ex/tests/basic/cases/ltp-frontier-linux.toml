schema_version = 2
name = "ltp-frontier-linux"
purpose = "diagnostic"
timeout_seconds = 300

[kernel]
target = "linux"

[disk]
mode = "private-copy"
profile = "canonical"

[qemu]
memory_mb = 128
smp = 8
kernel_cmdline = "earlycon=sbi root=/dev/vda rw console=ttyS0 init=/bin/sh"
rng = true
exit_policy = "marker"
exit_marker = "lkm-ltp: complete"
interaction = "scripted"
stdin_steps = [
  { ready_marker = "~ #", payload = "/opt/lkm/tests/ltp-init.sh frontier\n" },
]

[expect]
markers = ["lkm-ltp: complete"]

schema_version = 1
name = "kernel-smoke-linux-object"
timeout_seconds = 120

[kernel]
app = "smoke"
provider = "linux-object"
probe = []
profile = "release"

[disk]
mode = "canonical-readonly"

[qemu]
memory_mb = 128
smp = 8
kernel_cmdline = "earlycon=sbi"
rng = true
exit_policy = "guest-shutdown"

[expect]
process_exit = 0
markers = ["result:", " failed=0 total="]
forbidden_markers = ["FAILED", "arceos_ex panic"]

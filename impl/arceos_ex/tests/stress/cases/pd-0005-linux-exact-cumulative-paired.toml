name = "pd-0005-linux-exact-cumulative-paired"
description = "Run arceos_ex and Linux distro /bin/sh with delayed /bin/ls input and diff the cumulative stable exact runtime checkpoint intersection, including absorbed payload exec anchors."
mode = "paired_checkpoint_diff"
default_runs = 1
timeout_seconds = 360
working_directory = "."
setup_command = [
  "make",
  "-C",
  "impl/arceos_ex",
  "disk",
  "FORCE=1",
  "VIRTIO_BLK_IMAGE=build/stress-linux-exact-cumulative.raw",
  "ROOTFS_OVERLAY=none",
]

[paired]
checkpoint_scope = [
  "EntryPreludePhase.Started",
  "EventStream.Prepared",
  "ExceptionStream.Prepared",
  "TrampolineVm.Online",
  "KernelImage.Online",
  "EventStream.Ready",
  "ExceptionStream.Ready",
  "StartupTimeline.Started",
  "CorePreparePhase.Started",
  "CorePreparePhase.Ready",
  "MmCoreInitPhase.Started",
  "MmCoreInitPhase.Ready",
  "SchedInitPhase.Started",
  "SchedInitPhase.Ready",
  "IrqTimeInitPhase.Started",
  "LocalIrqEnablePhase.Started",
  "LocalIrqEnablePhase.Ready",
  "ProcessPreparePhase.Started",
  "BootInitRestInitPhase.Ready",
  "PreSmpInitPhase.Started",
  "SmpBringupPhase.Started",
  "SmpBringupPhase.Ready",
  "RuntimeCorePhase.Started",
  "Scheduler.SmpReady",
  "Workqueue.TopologyReady",
  "AsyncCore.DeferredReady",
  "PadataCore.DeferredReady",
  "PageAllocator.LateReady",
  "RuntimeCoreBoundary.Ready",
  "InitcallPhase.Started",
  "CpusetSmp.TrimmedReady",
  "DriverCore.DeferredReady",
  "IrqProcView.DeferredReady",
  "CtorTable.Ready",
  "InitcallTable.Ready",
  "InitcallBoundary.Ready",
  "RootfsPhase.Started",
  "KUnitRuntime.TrimmedReady",
  "InitramfsSync.DeferredReady",
  "RootfsConsole.DeferredReady",
  "RamdiskExecuteCommand.EaccessCheckpoint",
  "RootFS.Online",
  "IntegrityKeys.DeferredReady",
  "RootfsBoundary.Ready",
  "FinalizePhase.Started",
  "AsyncFullSync.DeferredReady",
  "SystemState.FreeingInitmemCheckpoint",
  "InitMemoryCleanup.DeferredReady",
  "KernelMappingProtection.DeferredReady",
  "PtiFinalize.TrimmedReady",
  "SystemState.Online",
  "RcuCore.InkernelBootEnded",
  "RcuBootEnd.Ready",
  "SysctlArgs.DeferredReady",
  "PayloadPhase.Ready",
  "PayloadPhase.Online",
  "UserBoot.MainElfReady",
  "UserBoot.InterpreterReady",
  "UserBoot.AddressSpaceSetupStart",
  "UserAddressSpace.Ready",
  "UserExec.MainElfReady",
  "UserExec.InterpreterReady",
  "UserExec.ContextReplaced",
  "UserExec.SatpReady",
  "UserExec.TrapFrameReady",
]

[paired.arceos_ex]
working_directory = "."
command = [
  "make",
  "run",
  "APP=user-boot",
  "PROBE=announce,stress-mem",
  "STRESS_MEM_BYTES=131072",
  "QEMU_SMP=2",
  "VIRTIO_BLK_IMAGE=build/stress-linux-exact-cumulative.raw",
  "QEMU_APPEND=earlycon=sbi init=/bin/sh",
]

[paired.arceos_ex.delayed_stdin]
ready_marker = "/ #"
payload = "/bin/ls\nexit\n"

[paired.linux]
working_directory = "../linux-6.12"
build_command = [
  "make",
  "ARCH=riscv",
  "CROSS_COMPILE=riscv64-linux-gnu-",
  "KCPPFLAGS=-DCONFIG_LKM_CHECKPOINTS",
  "-j",
  "$(nproc)",
]
command = [
  "qemu-system-riscv64",
  "-m",
  "128M",
  "-smp",
  "2",
  "-machine",
  "virt",
  "-bios",
  "default",
  "-kernel",
  "./arch/riscv/boot/Image",
  "-device",
  "virtio-blk-device,drive=disk0",
  "-drive",
  "id=disk0,if=none,format=raw,file=../lkm/impl/arceos_ex/build/stress-linux-exact-cumulative.raw",
  "-device",
  "virtio-net-device,netdev=net0",
  "-netdev",
  "user,id=net0,hostfwd=tcp::5555-:5555",
  "-nographic",
  "-append",
  "earlycon=sbi root=/dev/vda rw console=ttyS0 init=/bin/sh",
]
stop_after_stress_mem = true

[paired.linux.delayed_stdin]
ready_marker = "~ #"
payload = "/bin/ls\nexit\n"

[metadata]
observation_mode = "paired-checkpoint-diff"
linux_exact_runtime_target_count = 103
excluded_checkpoint_mapping_kinds = ["range", "unmapped"]
cumulative_scope = "stable exact-mapped checkpoint intersection declared by pd-0001 through pd-0004, plus pd-0004 payload exec hard scope absorbed into the active cumulative shell case"
payload = "/bin/sh delayed /bin/ls then exit"

name = "df-0003-distro-sh-ls"
description = "Repeat two sequential external commands on the non-PTY distro /bin/sh delayed-input path for DF-0003."
default_runs = 30
timeout_seconds = 120
working_directory = "."
setup_command = [
  "make",
  "disk",
  "ROOTFS=canonical",
]
command = [
  "make",
  "run",
  "TEST=distro-sh-native",
]
classifier = "../classifiers/df-0003-distro-sh-ls.toml"

[metadata]
defect = "DF-0003"
ordinary_path_required = true
interactive_shell = true

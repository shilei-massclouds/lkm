name = "df-0001-user-boot-stress-mem"
description = "Repeat user-boot with unified in-guest memory capture for DF-0001 timing checks."
default_runs = 30
timeout_seconds = 120
working_directory = "."
setup_command = [
  "make",
  "-C",
  "impl/arceos_ex",
  "disk",
  "FORCE=1",
  "VIRTIO_BLK_IMAGE=build/stress-df-0001-user-boot-stress-mem.raw",
  "ROOTFS_OVERLAY=default",
]
command = [
  "make",
  "run",
  "APP=user-boot",
  "PROBE=stress-mem",
  "STRESS_MEM_BYTES=65536",
  "VIRTIO_BLK_IMAGE=build/stress-df-0001-user-boot-stress-mem.raw",
  "QEMU_APPEND=earlycon=sbi",
]
classifier = "../classifiers/defects.toml"

[metadata]
defect = "DF-0001"
ordinary_path_required = false
observation_mode = "stress-mem"

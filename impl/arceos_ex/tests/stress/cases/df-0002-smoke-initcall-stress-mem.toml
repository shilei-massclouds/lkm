name = "df-0002-smoke-initcall-stress-mem"
description = "Repeat smoke with unified in-guest memory capture for DF-0002 timing checks."
default_runs = 30
timeout_seconds = 120
working_directory = "."
setup_command = [
  "make",
  "-C",
  "impl/arceos_ex",
  "disk",
  "FORCE=1",
  "VIRTIO_BLK_IMAGE=build/stress-df-0002-smoke-initcall-stress-mem.raw",
  "ROOTFS_OVERLAY=default",
]
command = [
  "make",
  "run",
  "APP=smoke",
  "PROBE=stress-mem",
  "STRESS_MEM_BYTES=65536",
  "VIRTIO_BLK_IMAGE=build/stress-df-0002-smoke-initcall-stress-mem.raw",
]
classifier = "../classifiers/defects.toml"

[metadata]
defect = "DF-0002"
ordinary_path_required = false
observation_mode = "stress-mem"

name = "df-0001-user-boot"
description = "Repeat the canonical user-smoke-native acceptance path to reproduce DF-0001."
default_runs = 30
timeout_seconds = 120
working_directory = "."
setup_command = [
  "make",
  "disk",
  "ROOTFS=canonical",
]
command = [
  "make",
  "run",
  "TEST=user-smoke-native",
]
classifier = "../classifiers/defects.toml"

[metadata]
defect = "DF-0001"
ordinary_path_required = true

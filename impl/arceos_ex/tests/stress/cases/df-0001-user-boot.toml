name = "df-0001-user-boot"
description = "Repeat the ordinary user-boot path to reproduce DF-0001."
default_runs = 30
timeout_seconds = 120
working_directory = "."
setup_command = [
  "make",
  "-C",
  "impl/arceos_ex",
  "legacy-disk",
  "FORCE=1",
  "VIRTIO_BLK_IMAGE=build/stress-df-0001-user-boot.raw",
  "ROOTFS_LTP_OVERLAY=none",
  "ROOTFS_OVERLAY=default",
]
command = [
  "make",
  "legacy-run",
  "APP=user-boot",
  "ROOTFS_LTP_OVERLAY=none",
  "VIRTIO_BLK_IMAGE=build/stress-df-0001-user-boot.raw",
  "QEMU_APPEND=earlycon=sbi",
]
classifier = "../classifiers/defects.toml"

[metadata]
defect = "DF-0001"
ordinary_path_required = true

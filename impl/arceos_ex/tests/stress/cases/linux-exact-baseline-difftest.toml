schema_version = 2
name = "linux-exact-baseline-difftest"
description = "Run the long-term Linux/arceos_ex baseline difftest for distro /bin/sh with two delayed sequential /bin/ls commands, comparing the cumulative stable exact runtime checkpoint intersection."

schema_version = 2
name = "rc-local-difftest"
description = "Run the default Linux/arceos_ex paired checkpoint diff for the canonical rc-local launcher, comparing the stable checkpoint prefix through the shell and /bin/ls execs."
mode = "difftest"
runs = 1
left_test = "rc-local-native"
left_label = "arceos_ex"
right_test = "rc-local-linux"
right_label = "linux"
checkpoint_scope = [
  "TrapType.Prepared",
  "ExceptionType.Prepared",
  "CorePreparePhase.Started",
  "CorePreparePhase.Ready",
  "MmCoreInitPhase.Started",
  "MmCoreInitPhase.Ready",
  "SchedInitPhase.Started",
  "SchedInitPhase.Ready",
  "IrqTimeInitPhase.Started",
  "LocalIrqEnablePhase.Started",
  "LocalIrqEnablePhase.Ready",
  "ProcessPreparePhase.Started",
  "BootInitRestInitPhase.Ready",
  "PreSmpInitPhase.Started",
  "SmpBringupPhase.Started",
  "SmpBringupPhase.Ready",
  "RuntimeCorePhase.Started",
  "Scheduler.SmpReady",
  "Workqueue.TopologyReady",
  "AsyncCore.DeferredReady",
  "PadataCore.DeferredReady",
  "PageAllocator.LateReady",
  "RuntimeCoreBoundary.Ready",
  "InitcallPhase.Started",
  "CpusetSmp.TrimmedReady",
  "DriverCore.DeferredReady",
  "IrqProcView.DeferredReady",
  "CtorTable.Ready",
  "InitcallTable.Ready",
  "InitcallBoundary.Ready",
  "RootfsPhase.Started",
  "KUnitRuntime.TrimmedReady",
  "InitramfsSync.DeferredReady",
  "RootfsConsole.DeferredReady",
  "RamdiskExecuteCommand.EaccessCheckpoint",
  "RootFS.Online",
  "IntegrityKeys.DeferredReady",
  "RootfsBoundary.Ready",
  "FinalizePhase.Started",
  "AsyncFullSync.DeferredReady",
  "SystemState.FreeingInitmemCheckpoint",
  "InitMemoryCleanup.DeferredReady",
  "KernelMappingProtection.DeferredReady",
  "PtiFinalize.TrimmedReady",
  "SystemState.Online",
  "RcuCore.InkernelBootEnded",
  "RcuBootEnd.Ready",
  "SysctlArgs.DeferredReady",
  "PayloadPreparePhase.Online",
  "KernelInitFlow.PayloadHandoffCommitted",
  "UserBoot.MainElfReady",
  "UserBoot.AddressSpaceSetupStart",
  "UserAddressSpace.Ready",
  "UserExec.MainElfReady",
  "UserExec.InterpreterReady",
  "UserExec.ContextReplaced",
  "UserExec.SatpReady",
  "UserExec.TrapFrameReady",
  "UserExec.MainElfReady",
  "UserExec.InterpreterReady",
  "UserExec.ContextReplaced",
  "UserExec.SatpReady",
  "UserExec.TrapFrameReady",
  "UserExec.MainElfReady",
  "UserExec.InterpreterReady",
  "UserExec.ContextReplaced",
  "UserExec.SatpReady",
  "UserExec.TrapFrameReady",
]

[checkpoint_scope_max_counts]
"UserExec.MainElfReady" = 3
"UserExec.InterpreterReady" = 3
"UserExec.ContextReplaced" = 3
"UserExec.SatpReady" = 3
"UserExec.TrapFrameReady" = 3

[checkpoint_coverage]
mapping_path = "tools/out/checkpoints/linux_checkpoint_mapping.json"
required_mapping_kinds = ["exact"]
mode = "explicit-accounting"

[checkpoint_coverage.accounted_outside_scope]
"UserBoot.InterpreterReady" = "canonical_rc_local_launcher_is_static_and_has_no_pt_interp"
"Kernel.Started" = "outside_stable_rc_local_hard_scope_pending_expansion"
"BootInitFlow.Started" = "outside_stable_rc_local_hard_scope_pending_expansion"
"BootInitFlow.Prepared" = "outside_stable_rc_local_hard_scope_pending_expansion"
"TrampolineVm.ActivatedOnCpu" = "outside_stable_rc_local_hard_scope_pending_expansion"
"RawDtb.Prepared" = "outside_stable_rc_local_hard_scope_pending_expansion"
"RawDtb.Ready" = "outside_stable_rc_local_hard_scope_pending_expansion"
"EarlyVm.Ready" = "outside_stable_rc_local_hard_scope_pending_expansion"
"EarlyVm.ActivatedOnCpu" = "outside_stable_rc_local_hard_scope_pending_expansion"
"KernelImage.Online" = "outside_stable_rc_local_hard_scope_pending_expansion"
"TrapType.Ready" = "outside_stable_rc_local_hard_scope_pending_expansion"
"ExceptionType.Ready" = "outside_stable_rc_local_hard_scope_pending_expansion"
"CpuStartProvider.Ready" = "outside_stable_rc_local_hard_scope_pending_expansion"
"CpuStartProvider.BootDataSelected" = "outside_stable_rc_local_hard_scope_pending_expansion"
"CpuStartProvider.BootDataPublished" = "outside_stable_rc_local_hard_scope_pending_expansion"
"CpuStartProvider.HsmStartIssued" = "outside_stable_rc_local_hard_scope_pending_expansion"
"ApEntryPreludePhase.Started" = "outside_stable_rc_local_hard_scope_pending_expansion"
"ApEntryPreludePhase.CurrentStackEstablished" = "outside_stable_rc_local_hard_scope_pending_expansion"
"ApEntryPreludePhase.Ready" = "outside_stable_rc_local_hard_scope_pending_expansion"
"ApSmpCallinPhase.Started" = "outside_stable_rc_local_hard_scope_pending_expansion"
"ApSmpCallinPhase.CpuRunningProduced" = "outside_stable_rc_local_hard_scope_pending_expansion"
"ApSmpCallinPhase.Ready" = "outside_stable_rc_local_hard_scope_pending_expansion"
"ApOnlineIdlePhase.Started" = "outside_stable_rc_local_hard_scope_pending_expansion"
"ApOnlineIdlePhase.DoneUpProduced" = "outside_stable_rc_local_hard_scope_pending_expansion"
"ApOnlineIdlePhase.Ready" = "outside_stable_rc_local_hard_scope_pending_expansion"
"SecondaryCpuStartupAck.Ready" = "outside_stable_rc_local_hard_scope_pending_expansion"
"SecondaryCpuOnlineAck.Ready" = "outside_stable_rc_local_hard_scope_pending_expansion"
"InitcallPhase.Ready" = "outside_stable_rc_local_hard_scope_pending_expansion"
"RootfsPhase.Ready" = "outside_stable_rc_local_hard_scope_pending_expansion"
"FinalizePhase.Ready" = "outside_stable_rc_local_hard_scope_pending_expansion"
"UserAppFlow.EnterUserMode" = "outside_stable_rc_local_hard_scope_pending_expansion"
"SyscallTable.ExecveArgsReady" = "outside_stable_rc_local_hard_scope_pending_expansion"
"UserExec.SatpSwitched" = "outside_stable_rc_local_hard_scope_pending_expansion"
"UserExec.ReturnFrameReady" = "outside_stable_rc_local_hard_scope_pending_expansion"
"SyscallTable.OpenAt" = "outside_stable_rc_local_hard_scope_pending_expansion"
"SyscallTable.Read" = "outside_stable_rc_local_hard_scope_pending_expansion"
"SyscallTable.Write" = "outside_stable_rc_local_hard_scope_pending_expansion"
"SyscallTable.Writev" = "outside_stable_rc_local_hard_scope_pending_expansion"
"SyscallTable.Close" = "outside_stable_rc_local_hard_scope_pending_expansion"
"SyscallTable.NewFstatAt" = "outside_stable_rc_local_hard_scope_pending_expansion"
"SyscallTable.SetTidAddress" = "outside_stable_rc_local_hard_scope_pending_expansion"

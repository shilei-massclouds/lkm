[metadata]
observation_mode = "canonical-rc-local-paired-checkpoint-diff"
baseline_role = "default-canonical-rc-local-launcher"
excluded_checkpoint_mapping_kinds = ["range", "unmapped"]
payload = "canonical /opt/lkm/tests/rc-local-init -> /bin/sh rc-local.sh -> /bin/ls and poweroff"
scope_note = "Default canonical rc-local baseline confirmed by a real paired run. Both sides use private canonical copies and the same explicit init launcher; the static launcher has no UserBoot.InterpreterReady, while three matched UserExec groups cover launcher-to-shell, /bin/ls, and poweroff."

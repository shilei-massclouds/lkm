name = "openrc-login-focused"
description = "Run the opt-in OpenRC getty/login shell diagnostic with staged login input and /bin/ls."
default_runs = 1
timeout_seconds = 180
working_directory = "."
setup_command = [
  "make",
  "-C",
  "impl/arceos_ex",
  "disk",
  "FORCE=1",
  "VIRTIO_BLK_IMAGE=build/stress-openrc-login-focused.raw",
  "ROOTFS_OVERLAY=none",
  "ROOTFS_FILE_OVERLAY_DIR=tests/rootfs-overlays/openrc-login",
]
command = [
  "python3",
  "tools/delayed_stdin.py",
  "--timeout",
  "170s",
  "--input-step",
  "login:",
  "test\n",
  "--input-step",
  "Password:",
  "test\n",
  "--input-step",
  "~$",
  "/bin/ls\nexit\n",
  "--",
  "make",
  "-C",
  "impl/arceos_ex",
  "run",
  "APP=user-boot",
  "PROBE=user-syscall-trace,user-syscall-error",
  "ROOTFS_OVERLAY=none",
  "ROOTFS_FILE_OVERLAY_DIR=tests/rootfs-overlays/openrc-login",
  "VIRTIO_BLK_IMAGE=build/stress-openrc-login-focused.raw",
  "QEMU_APPEND=earlycon=sbi",
]
classifier = "../classifiers/openrc-login-focused.toml"

[metadata]
observation_mode = "openrc-login-focused"
ordinary_path_required = false
opt_in_only = true
account_overlay = "tests/rootfs-overlays/openrc-login"
payload = "OpenRC getty/login shell /bin/ls"
scope_note = "Focused opt-in diagnostic case; not part of the default make test gate or default stress suite."

name = "openrc-login-focused"
description = "Repeat the canonical openrc-login-native acceptance path as an opt-in focused stress case."
default_runs = 1
timeout_seconds = 180
working_directory = "."
command = [
  "make",
  "run",
  "TEST=openrc-login-native",
]
classifier = "../classifiers/openrc-login-focused.toml"

[metadata]
observation_mode = "openrc-login-focused"
ordinary_path_required = false
opt_in_only = true
rootfs_profile = "canonical"
payload = "openrc-login-native basic acceptance"
scope_note = "Focused opt-in diagnostic case; not part of the default make test gate or default stress suite."

name = "pd-0004-linux-payload-syscall-paired"
description = "Run arceos_ex and Linux distro /bin/sh with delayed /bin/ls input and diff stable payload handoff checkpoints while reporting exec/syscall coverage."
mode = "paired_checkpoint_diff"
default_runs = 1
timeout_seconds = 360
working_directory = "."
setup_command = [
  "make",
  "-C",
  "impl/arceos_ex",
  "disk",
  "FORCE=1",
  "VIRTIO_BLK_IMAGE=build/stress-linux-payload-syscall.raw",
  "ROOTFS_OVERLAY=none",
]

[paired]
checkpoint_scope = [
  "PayloadPhase.Ready",
  "PayloadPhase.Online",
  "UserBoot.MainElfReady",
  "UserBoot.InterpreterReady",
  "UserBoot.AddressSpaceSetupStart",
  "UserAddressSpace.Ready",
]

[paired.arceos_ex]
working_directory = "."
command = [
  "make",
  "run",
  "APP=user-boot",
  "PROBE=announce,stress-mem",
  "STRESS_MEM_BYTES=65536",
  "QEMU_SMP=2",
  "VIRTIO_BLK_IMAGE=build/stress-linux-payload-syscall.raw",
  "QEMU_APPEND=earlycon=sbi init=/bin/sh",
]

[paired.arceos_ex.delayed_stdin]
ready_marker = "~ #"
payload = "/bin/ls\nexit\n"

[paired.linux]
working_directory = "../linux-6.12"
build_command = [
  "make",
  "ARCH=riscv",
  "CROSS_COMPILE=riscv64-linux-gnu-",
  "KCPPFLAGS=-DCONFIG_LKM_CHECKPOINTS",
  "-j",
  "$(nproc)",
]
command = [
  "qemu-system-riscv64",
  "-m",
  "128M",
  "-smp",
  "2",
  "-machine",
  "virt",
  "-bios",
  "default",
  "-kernel",
  "./arch/riscv/boot/Image",
  "-device",
  "virtio-blk-device,drive=disk0",
  "-drive",
  "id=disk0,if=none,format=raw,file=../lkm/impl/arceos_ex/build/stress-linux-payload-syscall.raw",
  "-device",
  "virtio-net-device,netdev=net0",
  "-netdev",
  "user,id=net0,hostfwd=tcp::5555-:5555",
  "-nographic",
  "-append",
  "earlycon=sbi root=/dev/vda rw console=ttyS0 init=/bin/sh",
]
stop_after_stress_mem = true

[paired.linux.delayed_stdin]
ready_marker = "~ #"
payload = "/bin/ls\nexit\n"

[metadata]
observation_mode = "paired-checkpoint-diff"
linux_exact_runtime_target_count = 88
excluded_checkpoint_mapping_kinds = ["range", "unmapped"]
payload = "/bin/sh delayed /bin/ls then exit"

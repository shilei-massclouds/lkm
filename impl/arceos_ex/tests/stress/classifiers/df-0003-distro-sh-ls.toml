[[rules]]
id = "panic"
result = "failure"
contains = ["arceos_ex panic"]
description = "Kernel panic was printed."

[[rules]]
id = "allocation-error"
result = "failure"
contains = ["memory allocation of"]
description = "The stable no_std allocation failure message was printed."

[[rules]]
id = "unsupported-syscall"
result = "failure"
contains = ["Function not implemented"]
description = "BusyBox reported an unsupported syscall or command path."

[[rules]]
id = "distro-sh-ls-success"
result = "success"
contains = ["ld-musl-riscv64.so.1", "lost+found", "user exit status=0"]
regex = [
  '(?s)~ # echo "OK"\nOK\n~ # ls\n.*?lost\+found.*?~ # ls /lib\n.*?ld-musl-riscv64\.so\.1.*?~ # ls /\n.*?lost\+found.*?~ # exit\n.*?user exit status=0',
]
description = "The scripted shell completed echo, cwd listing, /lib listing, root listing and clean exit in order."

[[rules]]
id = "panic"
result = "failure"
contains = ["arceos_ex panic"]
description = "Kernel panic was printed."

[[rules]]
id = "allocation-error"
result = "failure"
contains = ["memory allocation of"]
description = "The stable no_std allocation failure message was printed."

[[rules]]
id = "unsupported-syscall"
result = "failure"
contains = ["Function not implemented"]
description = "BusyBox reported an unsupported syscall or command path."

[[rules]]
id = "distro-sh-ls-success"
result = "success"
contains = ["lost+found", "user exit status=0"]
regex = ["(?s)lost\\+found.*lost\\+found"]
description = "Distro /bin/sh ran two sequential /bin/ls commands through fork/wait4/execve and exited cleanly."

[[rules]]
id = "panic"
result = "failure"
contains = ["arceos_ex panic"]
description = "Kernel panic was printed."

[[rules]]
id = "stress-mem-overflow"
result = "failure"
contains = ["overflow=1"]
description = "The checkpoint stress-memory recorder overflowed."

[[rules]]
id = "df-0014-checkpoint-cross-cpu-reentry"
result = "failure"
contains = [
  "checkpoint reentry",
  "lkm-rc-local: begin",
]
description = "Runtime reached rc.local, then concurrent checkpoint consumer dispatch was rejected as reentry."

[[rules]]
id = "df-0012-boot-direct-setup-after-dma-cache-policy"
result = "failure"
contains = [
  "checkpoint: DmaCachePolicy.Ready task=BootTask",
  "arceos_ex boot init direct setup failed",
  "error=C event=S actual=P expected=P target=R",
]
description = "The shared basic identity reproduced DF-0012 before reaching the DF-0014 runtime window."

[[rules]]
id = "df-0014-rc-local-success"
result = "success"
contains = [
  "lkm-rc-local: begin",
  "lost+found",
  "lkm-rc-local: end status=0",
]
description = "The same canonical native rc.local identity completed /bin/ls and powered off cleanly."

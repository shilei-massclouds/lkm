<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">独立的工程树与运行系统树</title>
  <desc id="desc">ComputerProject 拥有三个 Project；Computer 拥有三个运行系统；BootCpuRegisters 属于 Kernel 下的 BootCPU。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .project { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .system { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .artifact { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .edge { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .assembly { fill: none; stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .title { font: 700 24px sans-serif; fill: #0f172a; }
      .label { font: 600 17px sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .note { font: 14px sans-serif; fill: #475569; text-anchor: middle; }
      .handoff { font: 600 15px sans-serif; fill: #7c3aed; text-anchor: middle; }
    </style>
  </defs>

  <rect class="panel" x="30" y="30" width="540" height="650" rx="18"/>
  <rect class="panel" x="630" y="30" width="540" height="650" rx="18"/>
  <text class="title" x="300" y="72" text-anchor="middle">Projects（规格与构造）</text>
  <text class="title" x="900" y="72" text-anchor="middle">Systems（运行与启动）</text>

  <rect class="project" x="185" y="105" width="230" height="64" rx="12"/>
  <text class="label" x="300" y="137">ComputerProject</text>

  <path class="edge" d="M300 169 V215 H125 V255"/>
  <path class="edge" d="M300 169 V255"/>
  <path class="edge" d="M300 169 V215 H475 V255"/>

  <rect class="project" x="45" y="255" width="160" height="64" rx="12"/>
  <text class="label" x="125" y="287">HardwareProject</text>
  <rect class="project" x="220" y="255" width="160" height="64" rx="12"/>
  <text class="label" x="300" y="287">FirmwareProject</text>
  <rect class="project" x="395" y="255" width="160" height="64" rx="12"/>
  <text class="label" x="475" y="287">KernelProject</text>

  <path class="edge" d="M125 319 V385"/>
  <path class="edge" d="M300 319 V385"/>
  <path class="edge" d="M475 319 V385"/>
  <rect class="artifact" x="55" y="385" width="140" height="52" rx="10"/>
  <text class="label" x="125" y="411">Riscv64 spec</text>
  <rect class="artifact" x="230" y="385" width="140" height="52" rx="10"/>
  <text class="label" x="300" y="411">SbiSpec / BootArgs</text>
  <rect class="artifact" x="405" y="385" width="140" height="52" rx="10"/>
  <text class="label" x="475" y="411">Config / Lds</text>

  <text class="note" x="300" y="490">Preset：顺序建立三份系统规格</text>
  <text class="note" x="300" y="518">Setup：顺序构造产物，三个子 Project 停在 Ready</text>
  <text class="note" x="300" y="546">Enable：只把启动交接给 Computer</text>

  <rect class="system" x="785" y="105" width="230" height="64" rx="12"/>
  <text class="label" x="900" y="137">Computer</text>

  <path class="edge" d="M900 169 V215 H725 V255"/>
  <path class="edge" d="M900 169 V255"/>
  <path class="edge" d="M900 169 V215 H1075 V255"/>

  <rect class="system" x="645" y="255" width="160" height="64" rx="12"/>
  <text class="label" x="725" y="287">Riscv64Platform</text>
  <rect class="system" x="820" y="255" width="160" height="64" rx="12"/>
  <text class="label" x="900" y="287">OpenSBI</text>
  <rect class="system" x="995" y="255" width="160" height="64" rx="12"/>
  <text class="label" x="1075" y="287">Kernel</text>

  <path class="edge" d="M1075 319 V350"/>
  <rect class="system" x="995" y="350" width="160" height="46" rx="10"/>
  <text class="label" x="1075" y="373">BootCurrentCPU</text>
  <path class="edge" d="M1075 396 V420"/>
  <rect class="system" x="995" y="420" width="160" height="46" rx="10"/>
  <text class="label" x="1075" y="443">BootCPU</text>
  <path class="edge" d="M1075 466 V490"/>
  <rect class="artifact" x="995" y="490" width="160" height="46" rx="10"/>
  <text class="label" x="1075" y="513">BootCpuRegisters</text>

  <path class="assembly" d="M725 565 H900"/>
  <path class="assembly" d="M900 565 H1075"/>
  <text class="handoff" x="900" y="553">异步 Startup FIFO</text>
  <text class="note" x="900" y="600">Computer → Riscv64Platform → OpenSBI → Kernel</text>
  <text class="note" x="900" y="628">平台独立推进；OpenSBI 只确定交接 a0/a1</text>

  <path class="assembly" d="M125 437 C390 585, 570 535, 725 319"/>
  <path class="assembly" d="M300 437 C500 630, 745 630, 900 319"/>
  <path class="assembly" d="M475 437 C650 600, 900 600, 1075 319"/>
  <text class="handoff" x="600" y="654">静态规格/构造映射；不是运行时 ownership</text>
</svg>

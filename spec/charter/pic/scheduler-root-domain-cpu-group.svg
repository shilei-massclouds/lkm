<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
  <title id="title">DefaultSchedRootDomain 与 CpuGroup 的引用关系</title>
  <desc id="desc">CpuGroup 维护 CPU 身份、logical-id 索引和 possible CPU 引用集合；DefaultSchedRootDomain 从调度视角覆盖同一批 possible CPU 引用，并作为 RunQueue attach 的默认目标。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 600; }
      .subtitle { font-size: 17px; fill: #475569; }
      .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.3; }
      .source { fill: #eef2ff; stroke: #6366f1; }
      .view { fill: #ecfdf5; stroke: #10b981; }
      .cpu { fill: #f8fafc; stroke: #64748b; }
      .rq { fill: #eff6ff; stroke: #3b82f6; }
      .deferred { fill: #f1f5f9; stroke: #64748b; stroke-dasharray: 6 4; }
      .label { font-size: 19px; font-weight: 600; dominant-baseline: middle; }
      .small { font-size: 14px; fill: #475569; dominant-baseline: middle; }
      .tiny { font-size: 13px; fill: #475569; dominant-baseline: middle; }
      .edge { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .edge-strong { stroke: #0f766e; stroke-width: 2; fill: none; marker-end: url(#arrowStrong); }
      .edge-dash { stroke: #64748b; stroke-width: 1.5; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .note { font-size: 14px; fill: #334155; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowStrong" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="620" fill="#ffffff"/>
  <text x="590" y="44" text-anchor="middle" class="title">DefaultSchedRootDomain 与 CpuGroup 的引用关系</text>
  <text x="590" y="74" text-anchor="middle" class="subtitle">CpuGroup 是 CPU 身份与集合事实来源；DefaultSchedRootDomain 是调度视角的 possible CPU 覆盖域</text>

  <rect x="50" y="115" width="345" height="385" rx="14" class="group"/>
  <text x="222" y="146" text-anchor="middle" class="label">CpuGroup</text>
  <text x="222" y="174" text-anchor="middle" class="small">logical-id 索引和 CPU 集合视图</text>

  <rect x="82" y="212" width="280" height="54" rx="8" class="box source"/>
  <text x="222" y="232" text-anchor="middle" class="label">Cpu[0] -&gt; CpuRef</text>
  <text x="222" y="254" text-anchor="middle" class="small">BootCPU, logical id 0</text>

  <rect x="82" y="292" width="280" height="54" rx="8" class="box source"/>
  <text x="222" y="312" text-anchor="middle" class="label">Cpu[n] -&gt; CpuRef</text>
  <text x="222" y="334" text-anchor="middle" class="small">secondary CPU instances</text>

  <rect x="82" y="385" width="280" height="72" rx="8" class="box view"/>
  <text x="222" y="409" text-anchor="middle" class="label">possible_cpus</text>
  <text x="222" y="432" text-anchor="middle" class="small">集合元素是 CpuRef</text>

  <rect x="460" y="130" width="260" height="150" rx="14" class="box cpu"/>
  <text x="590" y="160" text-anchor="middle" class="label">CPU 实例</text>
  <text x="590" y="190" text-anchor="middle" class="small">BootCPU 与 secondary CPU</text>
  <text x="590" y="218" text-anchor="middle" class="small">持有 logical_id / hartid</text>
  <text x="590" y="246" text-anchor="middle" class="small">possible / present / online</text>

  <rect x="790" y="115" width="340" height="385" rx="14" class="group"/>
  <text x="960" y="146" text-anchor="middle" class="label">DefaultSchedRootDomain</text>
  <text x="960" y="174" text-anchor="middle" class="small">Scheduler 的默认调度根域</text>

  <rect x="820" y="216" width="280" height="76" rx="8" class="box view"/>
  <text x="960" y="240" text-anchor="middle" class="label">covered_cpus</text>
  <text x="960" y="265" text-anchor="middle" class="small">等于 CpuGroup.possible_cpus</text>

  <rect x="820" y="330" width="280" height="88" rx="8" class="box rq"/>
  <text x="960" y="354" text-anchor="middle" class="label">RunQueue attach target</text>
  <text x="960" y="379" text-anchor="middle" class="small">Cpu[id].RunQueue.root_domain</text>
  <text x="960" y="403" text-anchor="middle" class="small">cpu_ref 必须在 covered_cpus 内</text>

  <rect x="455" y="375" width="270" height="78" rx="8" class="box deferred"/>
  <text x="590" y="399" text-anchor="middle" class="label">后续共享调度状态</text>
  <text x="590" y="424" text-anchor="middle" class="small">RT / DL / EAS / topology</text>

  <path d="M362 238 C400 238, 419 205, 458 205" class="edge"/>
  <path d="M362 319 C404 319, 419 245, 458 245" class="edge"/>
  <path d="M362 421 C512 421, 666 252, 818 252" class="edge-strong"/>
  <path d="M720 204 C754 204, 780 228, 818 252" class="edge"/>
  <path d="M960 292 L960 328" class="edge"/>
  <path d="M820 374 C777 374, 764 408, 727 414" class="edge-dash"/>

  <text x="590" y="522" text-anchor="middle" class="note">关系式：DefaultSchedRootDomain.covered_cpus == CpuGroup.possible_cpus</text>
  <text x="590" y="548" text-anchor="middle" class="note">约束：DefaultSchedRootDomain 不拥有 CPU 本体；它只维护来自 CpuGroup 的 CpuRef 覆盖视图</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc">
  <title id="title">Flow、Context、句柄链与对象</title>
  <desc id="desc">句柄依附于对象。每个对象具有最接近对象的基础句柄，外层句柄在内层句柄基础上增加约束、保护或功能。不同上下文中的 Flow 可合法取得不同层级的句柄。</desc>
  <defs>
    <style>
      .title { font: 700 24px "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .context { fill: #ffffff; stroke: #374151; stroke-width: 2; stroke-dasharray: 9 7; }
      .flow { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .handle { fill: #f8fafc; stroke: #111827; stroke-width: 2; }
      .handle0 { fill: #f5f3ff; stroke: #7c3aed; }
      .handle1 { fill: #fffbeb; stroke: #d97706; }
      .handle2 { fill: #ecfdf5; stroke: #059669; }
      .object { fill: #f9fafb; stroke: #111827; stroke-width: 2.5; }
      .label { font: 700 20px "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 600 15px "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #374151; text-anchor: middle; dominant-baseline: middle; }
      .muted { font: 600 14px "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #6b7280; text-anchor: middle; dominant-baseline: middle; }
      .arrow { fill: none; stroke: #111827; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .dotted { fill: none; stroke: #4b5563; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 4 8; marker-end: url(#arrow-muted); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="640" fill="#ffffff"/>
  <text x="540" y="36" class="title" text-anchor="middle">Flow, Context, Handle Chain, Object</text>

  <rect x="70" y="70" width="260" height="420" rx="14" ry="14" class="context"/>
  <rect x="410" y="70" width="260" height="420" rx="14" ry="14" class="context"/>
  <rect x="750" y="70" width="260" height="420" rx="14" ry="14" class="context"/>

  <text x="200" y="96" class="label">Context A</text>
  <text x="540" y="96" class="label">Context B</text>
  <text x="880" y="96" class="label">Context C</text>

  <rect x="120" y="122" width="160" height="58" rx="10" ry="10" class="flow"/>
  <rect x="460" y="122" width="160" height="58" rx="10" ry="10" class="flow"/>
  <rect x="800" y="122" width="160" height="58" rx="10" ry="10" class="flow"/>
  <text x="200" y="146" class="label">Flow A</text>
  <text x="200" y="168" class="small">exclusive boot context</text>
  <text x="540" y="146" class="label">Flow B</text>
  <text x="540" y="168" class="small">concurrent context</text>
  <text x="880" y="146" class="label">Flow C</text>
  <text x="880" y="168" class="small">more restricted context</text>

  <rect x="90" y="520" width="900" height="54" rx="12" ry="12" class="object"/>
  <text x="540" y="547" class="label">Object Instance / Resource Object</text>

  <rect x="130" y="418" width="820" height="72" rx="12" ry="12" class="handle handle0"/>
  <text x="540" y="444" class="label">Handle 0 / Base Handle</text>
  <text x="540" y="470" class="small">closest to object; usually raw pointer</text>

  <rect x="220" y="318" width="640" height="72" rx="12" ry="12" class="handle handle1"/>
  <text x="540" y="344" class="label">Handle 1 / Protected Handle</text>
  <text x="540" y="370" class="small">wraps Handle 0; e.g. lock-protected access</text>

  <rect x="310" y="218" width="460" height="72" rx="12" ry="12" class="handle handle2"/>
  <text x="540" y="244" class="label">Handle 2 / Outer Handle</text>
  <text x="540" y="270" class="small">wraps Handle 1; adds policy or function</text>

  <path d="M 540 520 L 540 490" class="arrow"/>
  <path d="M 540 418 L 540 390" class="arrow"/>
  <path d="M 540 318 L 540 290" class="arrow"/>

  <path d="M 200 180 C 200 280, 320 365, 430 418" class="dotted"/>
  <path d="M 540 180 L 540 318" class="dotted"/>
  <path d="M 880 180 C 840 205, 800 225, 770 242" class="dotted"/>

  <text x="540" y="606" class="muted">solid: object -> base handle -> outer handles; dotted: Flow obtains the legal handle for its Context</text>
</svg>

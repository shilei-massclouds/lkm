<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1220" viewBox="0 0 1280 1220" role="img" aria-labelledby="title desc">
  <title id="title">rootfs 准备期对象构建时序</title><desc id="desc">展示 RootfsPhase 的有效调用顺序。</desc>
  <defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",Arial,sans-serif;fill:#0f172a}.title{font-size:30px;font-weight:600}.subtitle{font-size:19px;fill:#475569}.lane{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:8 6}.box{fill:#fff;stroke:#334155;stroke-width:1.2}.stage{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}.fs{fill:#ecfdf5;stroke:#10b981}.console{fill:#eff6ff;stroke:#3b82f6}.sec{fill:#f5f3ff;stroke:#7c3aed}.checkpoint{fill:#f8fafc;stroke:#cbd5e1}.trimmed{fill:#fff7ed;stroke:#f97316;stroke-dasharray:7 5}.deferred{fill:#eff6ff;stroke:#3b82f6;stroke-dasharray:7 5}.obj{font-size:23px;font-weight:600;dominant-baseline:middle}.line1{font-size:21px;font-weight:600;dominant-baseline:middle}.line2{font-size:17px;fill:#475569;dominant-baseline:middle}.boundary{font-size:18px;font-weight:600;fill:#334155;dominant-baseline:middle}.num{font-size:17px;font-weight:600;fill:#fff;text-anchor:middle;dominant-baseline:middle}.timeline{stroke:#64748b;stroke-width:2;stroke-linecap:round}.dot{fill:#334155}</style></defs>
  <rect width="1280" height="1220" fill="#fff"/><text x="640" y="46" text-anchor="middle" class="title">rootfs 准备期对象构建时序</text><text x="640" y="76" text-anchor="middle" class="subtitle">RootfsPhase.setup(): kunit_run_all_tests() 到 integrity_load_keys()</text><rect x="48" y="126" width="214" height="1040" rx="14" class="lane"/><text x="155" y="162" text-anchor="middle" class="obj">rootfs 准备期</text><text x="155" y="188" text-anchor="middle" class="obj">RootfsPhase</text><line x1="155" y1="224" x2="155" y2="1130" class="timeline"/><rect x="292" y="116" width="876" height="52" rx="10" class="stage"/><text x="320" y="142" class="boundary">起点：InitcallPhase 已 Ready；rootfs/console/payload 前置条件尚未完成</text>
  <g transform="translate(0 -48)"><g transform="translate(0 56)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">1</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">KunitRuntime.run_all(): kunit_run_all_tests() trimmed/no-op</text><text x="320" y="260" class="line2">当前 CONFIG_KUNIT=n</text></g><g transform="translate(0 176)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">2</text><rect x="292" y="204" width="876" height="84" rx="10" class="box deferred"/><text x="320" y="232" class="line1">InitramfsSync.wait(): wait_for_initramfs() deferred</text><text x="320" y="260" class="line2">保留 initramfs async cookie 等待位置，当前不展开 domain/cookie 细节</text></g><g transform="translate(0 296)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">3</text><rect x="292" y="204" width="876" height="84" rx="10" class="box deferred"/><text x="320" y="232" class="line1">RootfsConsole.setup(): console_on_rootfs() deferred</text><text x="320" y="260" class="line2">保留 /dev/console 与 PID 1 标准 fd 准备位置</text></g><g transform="translate(0 416)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">4</text><rect x="292" y="204" width="876" height="84" rx="10" class="box checkpoint"/><text x="320" y="232" class="line1">EarlyInitGate.check(): init_eaccess(ramdisk_execute_command)</text><text x="320" y="260" class="line2">必须满足调用 prepare_namespace() 的条件，否则进入错误边界</text></g><g transform="translate(0 536)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">5</text><rect x="292" y="204" width="876" height="84" rx="10" class="box deferred"/><text x="320" y="232" class="line1">RootFS.enable(): prepare_namespace() deferred</text><text x="320" y="260" class="line2">包含从 RamFS/rootfs backing 到真实根文件系统的 handoff-like 切换</text></g><g transform="translate(0 656)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">6</text><rect x="292" y="204" width="876" height="84" rx="10" class="box deferred"/><text x="320" y="232" class="line1">IntegrityKeys.setup(): integrity_load_keys() deferred</text><text x="320" y="260" class="line2">保留 IMA/EVM key 加载位置，当前不展开 integrity 细节</text></g></g><rect x="292" y="1080" width="876" height="52" rx="10" class="stage"/><text x="320" y="1106" class="boundary">终点：RootFS.enable 和 IntegrityKeys 保留位置；下一步 FinalizePhase</text>
</svg>

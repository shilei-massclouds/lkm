<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">Ext2 对象建模关系</title>
  <desc id="desc">展示 Ext2Driver、Ext2Volume、Ext2FileSystem、VFS、RootFS 和块设备读路径之间的对象关系。</desc>
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",Arial,sans-serif;fill:#0f172a}
      .title{font-size:30px;font-weight:600}
      .subtitle{font-size:17px;fill:#475569}
      .group{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:8 6}
      .box{fill:#fff;stroke:#334155;stroke-width:1.3}
      .driver{fill:#eff6ff;stroke:#2563eb}
      .volume{fill:#fff7ed;stroke:#f97316}
      .fs{fill:#ecfdf5;stroke:#10b981}
      .vfs{fill:#eef2ff;stroke:#6366f1}
      .block{fill:#f5f3ff;stroke:#7c3aed}
      .deferred{fill:#f8fafc;stroke:#94a3b8;stroke-dasharray:7 5}
      .label{font-size:18px;font-weight:600;dominant-baseline:middle}
      .small{font-size:14px;fill:#475569;dominant-baseline:middle}
      .group-title{font-size:20px;font-weight:600;fill:#334155}
      .edge{stroke:#64748b;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
      .edge-dash{stroke:#94a3b8;stroke-width:1.5;fill:none;stroke-dasharray:7 5;marker-end:url(#arrow2)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1180" height="760" fill="#fff"/>
  <text x="590" y="46" text-anchor="middle" class="title">Ext2 对象建模关系</text>
  <text x="590" y="74" text-anchor="middle" class="subtitle">先描述对象意图，再落到 model/coding 规格，最后指导实现</text>

  <rect x="46" y="118" width="300" height="548" rx="14" class="group"/>
  <text x="196" y="150" text-anchor="middle" class="group-title">块设备与磁盘布局</text>
  <rect x="78" y="198" width="236" height="76" rx="8" class="box block"/>
  <text x="196" y="226" text-anchor="middle" class="label">BlockDeviceRegistry</text>
  <text x="196" y="250" text-anchor="middle" class="small">default / devt lookup</text>
  <rect x="78" y="320" width="236" height="76" rx="8" class="box block"/>
  <text x="196" y="348" text-anchor="middle" class="label">Bio / BufferHead</text>
  <text x="196" y="372" text-anchor="middle" class="small">sb_bread block input</text>
  <rect x="78" y="442" width="236" height="90" rx="8" class="box volume"/>
  <text x="196" y="470" text-anchor="middle" class="label">Ext2Volume</text>
  <text x="196" y="494" text-anchor="middle" class="small">on-disk ext2 layout</text>
  <text x="196" y="516" text-anchor="middle" class="small">superblock / gd / inode table</text>
  <path d="M196 274 L196 318" class="edge"/>
  <path d="M196 396 L196 440" class="edge"/>

  <rect x="410" y="118" width="350" height="548" rx="14" class="group"/>
  <text x="585" y="150" text-anchor="middle" class="group-title">Ext2 内核对象</text>
  <rect x="452" y="198" width="266" height="84" rx="8" class="box driver"/>
  <text x="585" y="226" text-anchor="middle" class="label">Ext2Driver</text>
  <text x="585" y="250" text-anchor="middle" class="small">operation set</text>
  <text x="585" y="270" text-anchor="middle" class="small">lookup / read / super ops</text>
  <rect x="452" y="348" width="266" height="108" rx="8" class="box fs"/>
  <text x="585" y="376" text-anchor="middle" class="label">Ext2FileSystem</text>
  <text x="585" y="400" text-anchor="middle" class="small">mounted in-memory instance</text>
  <text x="585" y="422" text-anchor="middle" class="small">superblock + root inode/dentry</text>
  <text x="585" y="444" text-anchor="middle" class="small">tree facts and backend state</text>
  <rect x="452" y="522" width="266" height="84" rx="8" class="box deferred"/>
  <text x="585" y="550" text-anchor="middle" class="label">Deferred Scope</text>
  <text x="585" y="574" text-anchor="middle" class="small">page cache / indirect / write</text>
  <path d="M585 282 L585 346" class="edge"/>
  <path d="M585 456 L585 520" class="edge-dash"/>
  <path d="M314 487 C360 487,392 402,450 402" class="edge"/>

  <rect x="824" y="118" width="310" height="548" rx="14" class="group"/>
  <text x="979" y="150" text-anchor="middle" class="group-title">VFS 与 rootfs 视图</text>
  <rect x="858" y="198" width="242" height="84" rx="8" class="box vfs"/>
  <text x="979" y="226" text-anchor="middle" class="label">VfsCore</text>
  <text x="979" y="250" text-anchor="middle" class="small">mount / dentry / inode</text>
  <text x="979" y="270" text-anchor="middle" class="small">path walk / open / read</text>
  <rect x="858" y="348" width="242" height="84" rx="8" class="box vfs"/>
  <text x="979" y="376" text-anchor="middle" class="label">RootFS</text>
  <text x="979" y="400" text-anchor="middle" class="small">prepare_namespace</text>
  <text x="979" y="420" text-anchor="middle" class="small">mount + MS_MOVE</text>
  <rect x="858" y="498" width="242" height="84" rx="8" class="box vfs"/>
  <text x="979" y="526" text-anchor="middle" class="label">FsStruct</text>
  <text x="979" y="550" text-anchor="middle" class="small">root / pwd dentry refs</text>
  <text x="979" y="570" text-anchor="middle" class="small">chroot(".") result</text>
  <path d="M718 402 C780 402,796 240,856 240" class="edge"/>
  <path d="M979 282 L979 346" class="edge"/>
  <path d="M979 432 L979 496" class="edge"/>
  <path d="M858 390 C805 390,785 402,720 402" class="edge-dash"/>

  <text x="590" y="700" text-anchor="middle" class="small">Ext2Volume 是块设备上的布局事实；Ext2Driver 是操作集合；Ext2FileSystem 是 mount 后的内存实例；VfsCore/RootFS/FsStruct 提供系统可见路径和根视图。</text>
</svg>

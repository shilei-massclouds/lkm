<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1900" viewBox="0 0 1280 1900" role="img" aria-labelledby="title desc">
  <title id="title">SMP 启动期 AP 侧时序</title>
  <desc id="desc">展示 RISC-V secondary CPU 从 AP 入口前导简化版到 smp_callin() 和 AP idle 的执行路径。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 600; }
      .subtitle { font-size: 19px; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .stage { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .flow { fill: #ecfdf5; stroke: #10b981; }
      .cpu { fill: #f0fdfa; stroke: #14b8a6; }
      .support { fill: #eff6ff; stroke: #3b82f6; }
      .sync { fill: #f5f3ff; stroke: #7c3aed; }
      .entry { fill: #fef9c3; stroke: #ca8a04; stroke-width: 1.4; }
      .trimmed { fill: #fff7ed; stroke: #f97316; stroke-dasharray: 7 5; }
      .obj { font-size: 23px; font-weight: 600; dominant-baseline: middle; }
      .line1 { font-size: 21px; font-weight: 600; dominant-baseline: middle; }
      .line2 { font-size: 17px; fill: #475569; dominant-baseline: middle; }
      .boundary { font-size: 18px; font-weight: 600; fill: #334155; dominant-baseline: middle; }
      .num { font-size: 17px; font-weight: 600; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .timeline { stroke: #64748b; stroke-width: 2; stroke-linecap: round; }
      .dot { fill: #334155; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="1900" fill="#ffffff"/>
  <text x="640" y="46" text-anchor="middle" class="title">SMP 启动期 AP 侧时序</text>
  <text x="640" y="76" text-anchor="middle" class="subtitle">目标 secondary CPU 自己执行 AP 入口前导简化版、smp_callin() 和 AP idle 入口</text>

  <rect x="48" y="126" width="214" height="1700" rx="14" class="lane"/>
  <text x="155" y="162" text-anchor="middle" class="obj">AP side</text>
  <text x="155" y="188" text-anchor="middle" class="obj">Secondary CPU</text>
  <line x1="155" y1="224" x2="155" y2="1790" class="timeline"/>

  <rect x="292" y="116" width="876" height="52" rx="10" class="stage"/>
  <text x="320" y="142" class="boundary">起点：BP side 已执行 CpuStartProvider.start(cpu, idle)，目标 hart 被释放</text>

  <g transform="translate(0 -48)">
  <g transform="translate(0 56)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">1</text><rect x="292" y="204" width="876" height="84" rx="10" class="box entry"/><text x="320" y="232" class="line1">SecondaryEntryPrelude: InterruptStream.preset + KernelImage.preset_gp</text><text x="320" y="260" class="line2">AP 屏蔽本地中断/pending，加载 gp，关闭 FPU/vector 内核使用位</text></g>
  <g transform="translate(0 176)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">2</text><rect x="292" y="204" width="876" height="84" rx="10" class="box entry"/><text x="320" y="232" class="line1">SecondaryEntryPrelude: EventStream.setup + IdleTask/Stack.bind</text><text x="320" y="260" class="line2">AP 设置临时 park 事件入口，并从 boot data 装载 tp/current 与 sp</text></g>
  <g transform="translate(0 296)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">3</text><rect x="292" y="204" width="876" height="84" rx="10" class="box entry"/><text x="320" y="232" class="line1">SecondaryEntryPrelude: KernelAddressSpace.enable_secondary</text><text x="320" y="260" class="line2">AP 复用已建立的内核页表，切换 satp 并进入内核虚拟地址</text></g>
  <g transform="translate(0 416)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">4</text><rect x="292" y="204" width="876" height="84" rx="10" class="box entry"/><text x="320" y="232" class="line1">SecondaryEntryPrelude: EventStream.enable + SCS.load_current</text><text x="320" y="260" class="line2">AP 切到正式 handle_exception，清 sscratch，并加载 shadow call stack</text></g>
  <g transform="translate(0 536)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">5</text><rect x="292" y="204" width="876" height="84" rx="10" class="box flow"/><text x="320" y="232" class="line1">Cpu[cpu].smp_callin(): smp_callin()</text><text x="320" y="260" class="line2">AP 进入 C 层 bringup 入口；smp_callin() 不是 AP 的第一条路径</text></g>
  <g transform="translate(0 656)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">6</text><rect x="292" y="204" width="876" height="84" rx="10" class="box support"/><text x="320" y="232" class="line1">VectorContext.verify_cpu_vlen(cpu) + bind init_mm</text><text x="320" y="260" class="line2">有 vector 时校验 vlen；AP idle task 绑定 KernelAddressSpace.init_mm</text></g>
  <g transform="translate(0 776)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">7</text><rect x="292" y="204" width="876" height="84" rx="10" class="box cpu"/><text x="320" y="232" class="line1">CpuTopology.record(cpu) + CpuHotplugState.notify_starting(cpu)</text><text x="320" y="260" class="line2">记录 secondary topology，运行 AP starting callback range</text></g>
  <g transform="translate(0 896)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">8</text><rect x="292" y="204" width="876" height="84" rx="10" class="box support"/><text x="320" y="232" class="line1">SbiIpi.enable(cpu) + Cpu[cpu].mark_online()</text><text x="320" y="260" class="line2">AP 启用 IPI 接收路径，NUMA 当前裁剪，并设置 cpu_online</text></g>
  <g transform="translate(0 1016)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">9</text><rect x="292" y="204" width="876" height="84" rx="10" class="box support"/><text x="320" y="232" class="line1">UserIsaExposure.enable(cpu) + flush_entry_caches()</text><text x="320" y="260" class="line2">启用用户态 ISA 暴露，flush icache/TLB</text></g>
  <g transform="translate(0 1136)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">10</text><rect x="292" y="204" width="876" height="84" rx="10" class="box sync"/><text x="320" y="232" class="line1">CpuHotplugState.cpu_running.complete()</text><text x="320" y="260" class="line2">AP complete(&amp;cpu_running)，释放 BP side 在 __cpu_up() 中的等待</text></g>
  <g transform="translate(0 1256)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">11</text><rect x="292" y="204" width="876" height="84" rx="10" class="box flow"/><text x="320" y="232" class="line1">InterruptStream.enable(cpu) + IdleTask.enable()</text><text x="320" y="260" class="line2">AP 打开 sstatus.SIE，并进入 cpu_startup_entry(CPUHP_AP_ONLINE_IDLE)</text></g>
  <g transform="translate(0 1376)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">12</text><rect x="292" y="204" width="876" height="84" rx="10" class="box sync"/><text x="320" y="232" class="line1">cpuhp_online_idle(): done_up.complete()</text><text x="320" y="260" class="line2">AP 到达 CPUHP_AP_ONLINE_IDLE，complete_ap_thread(st, true)</text></g>
  <g transform="translate(0 1496)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">13</text><rect x="292" y="204" width="876" height="84" rx="10" class="box flow"/><text x="320" y="232" class="line1">do_idle()</text><text x="320" y="260" class="line2">AP idle task 进入 idle loop；目标 CPU 已可调度其它内核线程</text></g>
  <g transform="translate(0 1616)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">14</text><rect x="292" y="204" width="876" height="84" rx="10" class="box flow"/><text x="320" y="232" class="line1">CpuHotplugThread.run_to_target(CPUHP_ONLINE)</text><text x="320" y="260" class="line2">被 BP 唤醒后，AP hotplug thread 继续执行后续 AP-side callbacks</text></g>
  </g>

  <rect x="292" y="1760" width="876" height="52" rx="10" class="stage"/>
  <text x="320" y="1786" class="boundary">终点：目标 secondary CPU 已 online；AP idle 与 AP hotplug thread 都可被调度执行</text>
</svg>

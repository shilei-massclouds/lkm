<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2640" viewBox="0 0 1280 2640" role="img" aria-labelledby="title desc">
  <title id="title">入口后继期对象构建时序</title>
  <desc id="desc">展示入口后继期从 start_kernel 到 paging_init 完成之间的核心对象构建顺序。</desc>
  <defs>
    <style>
      text {
        font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", Arial, sans-serif;
        fill: #0f172a;
      }
      .title { font-size: 30px; font-weight: 600; }
      .subtitle { font-size: 20px; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .phase { fill: #eef2ff; stroke: #6366f1; }
      .dtb { fill: #fff7ed; stroke: #f97316; }
      .mem { fill: #f0fdf4; stroke: #22c55e; }
      .addr { fill: #eff6ff; stroke: #3b82f6; }
      .log { fill: #fdf2f8; stroke: #db2777; }
      .svc { fill: #f0fdfa; stroke: #0f766e; }
      .param { fill: #f5f3ff; stroke: #7c3aed; }
      .task { fill: #fefce8; stroke: #ca8a04; }
      .cleanup { fill: #f1f5f9; stroke: #64748b; }
      .obj { font-size: 24px; font-weight: 500; dominant-baseline: middle; }
      .line1 { font-size: 23px; font-weight: 500; dominant-baseline: middle; }
      .line2 { font-size: 18px; fill: #475569; dominant-baseline: middle; }
      .boundary { font-size: 18px; font-weight: 600; fill: #334155; dominant-baseline: middle; }
      .num { font-size: 19px; font-weight: 600; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .timeline { stroke: #64748b; stroke-width: 2; stroke-linecap: round; }
      .dot { fill: #334155; }
      .stage { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="2640" fill="#ffffff"/>
  <text x="640" y="46" text-anchor="middle" class="title">入口后继期对象构建时序</text>
  <text x="640" y="76" text-anchor="middle" class="subtitle">核心路径：BootInitStack -> EarlyDtb.preset -> InterruptType -> BootCPU -> PrintkBuffer -> EarlyDtb.setup -> InitMM -> EarlyIoremap -> SBI -> EarlyParam(+EarlyCon) -> VM.enable()</text>

  <rect x="48" y="128" width="210" height="2410" rx="14" class="lane"/>
  <text x="153" y="164" text-anchor="middle" class="obj">入口后继期对象</text>
  <text x="153" y="190" text-anchor="middle" class="subtitle">setup()</text>
  <line x1="153" y1="224" x2="153" y2="2518" class="timeline"/>

  <rect x="290" y="118" width="870" height="50" rx="10" class="stage"/>
  <text x="318" y="143" class="boundary">起点边界：start_kernel() 入口，BootInitStack.Ready，InterruptType.Prepared，BootCPU.Prepared(present)</text>

  <g transform="translate(0 0)">
    <circle cx="153" cy="248" r="15" class="dot"/><text x="153" y="248" class="num">1</text>
    <rect x="290" y="205" width="870" height="86" rx="10" class="box cleanup"/>
    <text x="318" y="234" class="line1">BootInitStack.enable()</text>
    <text x="318" y="265" class="line2">建立根栈保护状态，使 BootInitStack.Ready -> Online</text>
  </g>

  <g transform="translate(0 112)">
    <circle cx="153" cy="248" r="15" class="dot"/><text x="153" y="248" class="num">2</text>
    <rect x="290" y="205" width="870" height="86" rx="10" class="box cleanup"/>
    <text x="318" y="234" class="line1">EarlyDtb.preset()</text>
    <text x="318" y="265" class="line2">解析 /cpus 与 /memory，建立 PlatformCpuInfo 和 PhysicalMemory</text>
  </g>

  <g transform="translate(0 224)">
    <circle cx="153" cy="248" r="15" class="dot"/><text x="153" y="248" class="num">3</text>
    <rect x="290" y="205" width="870" height="86" rx="10" class="box cleanup"/>
    <text x="318" y="234" class="line1">InterruptType.setup()</text>
    <text x="318" y="265" class="line2">local_irq_disable(): 防御式清除 sstatus.SIE，使 Prepared -> Ready</text>
  </g>

  <g transform="translate(0 336)">
    <circle cx="153" cy="248" r="15" class="dot"/><text x="153" y="248" class="num">4</text>
    <rect x="290" y="205" width="870" height="86" rx="10" class="box cleanup"/>
    <text x="318" y="234" class="line1">BootCPU.boot_cpu_init()</text>
    <text x="318" y="265" class="line2">推进 BootCPU: possible -> present -> active -> online</text>
  </g>

  <g transform="translate(0 448)">
    <circle cx="153" cy="248" r="15" class="dot"/><text x="153" y="248" class="num">5</text>
    <rect x="290" y="205" width="870" height="86" rx="10" class="box log"/>
    <text x="318" y="234" class="line1">PrintkBuffer.preset() + write(linux_banner)</text>
    <text x="318" y="265" class="line2">建立 printk 静态缓冲；Banner 先写入中间 ring buffer</text>
  </g>

  <g transform="translate(0 560)">
    <circle cx="153" cy="248" r="15" class="dot"/><text x="153" y="248" class="num">6</text>
    <rect x="290" y="205" width="870" height="86" rx="10" class="box dtb"/>
    <text x="318" y="234" class="line1">EarlyDtb.setup() / parse_dtb()</text>
    <text x="318" y="265" class="line2">提取 command line 和 memory ranges，并触发 MemBlock.preset()</text>
  </g>

  <g transform="translate(0 672)">
    <circle cx="153" cy="248" r="15" class="dot"/><text x="153" y="248" class="num">7</text>
    <rect x="290" y="205" width="870" height="86" rx="10" class="box task"/>
    <text x="318" y="234" class="line1">InitMM.setup() / setup_initial_init_mm()</text>
    <text x="318" y="265" class="line2">记录 _stext/_etext/_edata/_end，建立 init_mm 边界元数据</text>
  </g>

  <g transform="translate(0 784)">
    <circle cx="153" cy="248" r="15" class="dot"/><text x="153" y="248" class="num">8</text>
    <rect x="290" y="205" width="870" height="86" rx="10" class="box addr"/>
    <text x="318" y="234" class="line1">EarlyIoremap.setup() / early_ioremap_setup()</text>
    <text x="318" y="265" class="line2">依赖 FixMap.FIX_BTMAP，初始化临时映射 slot 元数据</text>
  </g>

  <g transform="translate(0 896)">
    <circle cx="153" cy="248" r="15" class="dot"/><text x="153" y="248" class="num">9</text>
    <rect x="290" y="205" width="870" height="86" rx="10" class="box svc"/>
    <text x="318" y="234" class="line1">SBI.setup() / sbi_init()</text>
    <text x="318" y="265" class="line2">探测 spec version、firmware identity 和扩展能力视图</text>
  </g>

  <g transform="translate(0 1008)">
    <circle cx="153" cy="248" r="15" class="dot"/><text x="153" y="248" class="num">10</text>
    <rect x="290" y="205" width="870" height="86" rx="10" class="box cleanup"/>
    <text x="318" y="234" class="line1">jump_label_init()</text>
    <text x="318" y="265" class="line2">defer：后续按 StaticKey/静态分支能力再展开</text>
  </g>

  <g transform="translate(0 1120)">
    <circle cx="153" cy="320" r="15" class="dot"/><text x="153" y="320" class="num">11</text>
    <rect x="290" y="205" width="870" height="318" rx="12" class="box param"/>
    <text x="318" y="234" class="line1">EarlyParam.setup() / parse_early_param()</text>
    <text x="318" y="265" class="line2">解析 KernelCmdline；earlycon handler 在同一调用链内驱动 EarlyCon</text>

    <rect x="340" y="312" width="760" height="48" rx="8" class="box param"/>
    <text x="366" y="330" class="line2">11.1  解析 KernelCmdline</text>
    <text x="366" y="350" class="line2">匹配 early_param("earlycon") handler</text>

    <rect x="340" y="374" width="760" height="48" rx="8" class="box log"/>
    <text x="366" y="392" class="line2">11.2  EarlyCon.preset(config=sbi)</text>
    <text x="366" y="412" class="line2">记录 earlycon=sbi 参数配置</text>

    <rect x="340" y="436" width="760" height="48" rx="8" class="box log"/>
    <text x="366" y="454" class="line2">11.3  EarlyCon.setup()</text>
    <text x="366" y="474" class="line2">基于 SBI 能力事实建立 SBI 输出后端</text>

    <rect x="340" y="498" width="760" height="58" rx="8" class="box log"/>
    <text x="366" y="520" class="line2">11.4  EarlyCon.enable()</text>
    <text x="366" y="542" class="line2">注册启用 early console，并 flush PrintkBuffer</text>
  </g>

  <g transform="translate(0 1490)">
    <circle cx="153" cy="248" r="15" class="dot"/><text x="153" y="248" class="num">12</text>
    <rect x="290" y="205" width="870" height="86" rx="10" class="box cleanup"/>
    <text x="318" y="234" class="line1">efi_init()</text>
    <text x="318" y="265" class="line2">defer：后续按 EFI / FirmwareInterface 引导路径再展开</text>
  </g>

  <g transform="translate(0 1618)">
    <circle cx="153" cy="248" r="15" class="dot"/><text x="153" y="248" class="num">13</text>
    <rect x="290" y="205" width="870" height="86" rx="10" class="box mem"/>
    <text x="318" y="234" class="line1">MemBlock.setup() / setup_bootmem()</text>
    <text x="318" y="265" class="line2">对候选物理内存区段施加保留、裁剪和对齐约束</text>
  </g>

  <g transform="translate(0 1746)">
    <circle cx="153" cy="310" r="15" class="dot"/><text x="153" y="310" class="num">14</text>
    <rect x="290" y="205" width="870" height="260" rx="12" class="box addr"/>
    <text x="318" y="234" class="line1">VM.enable() / setup_vm_final()</text>
    <text x="318" y="265" class="line2">依赖 MemBlock.Ready，把当前地址空间从 EarlyVM 推进到 SwapperVM</text>

    <rect x="340" y="312" width="760" height="48" rx="8" class="box addr"/>
    <text x="366" y="330" class="line2">14.1  SwapperVM.setup()</text>
    <text x="366" y="350" class="line2">建立完整内核页表；使用并清理临时页表构建 fixmap slots</text>

    <rect x="340" y="374" width="760" height="48" rx="8" class="box addr"/>
    <text x="366" y="392" class="line2">14.2  SwapperVM.enable()</text>
    <text x="366" y="412" class="line2">切换 RISCV64.satp 并同步 TLB</text>

    <rect x="340" y="436" width="760" height="48" rx="8" class="box cleanup"/>
    <text x="366" y="454" class="line2">14.3  EarlyVM.cleanup()</text>
    <text x="366" y="474" class="line2">EarlyVM 退出当前地址空间服务</text>
  </g>

  <g transform="translate(0 2106)">
    <circle cx="153" cy="248" r="15" class="dot"/><text x="153" y="248" class="num">15</text>
    <rect x="290" y="205" width="870" height="86" rx="10" class="box mem"/>
    <text x="318" y="234" class="line1">MemBlock.enable() / memblock_allow_resize()</text>
    <text x="318" y="265" class="line2">完整线性映射可用后，允许 MemBlock 元数据扩展</text>
  </g>

  <g transform="translate(0 2234)">
    <circle cx="153" cy="248" r="15" class="dot"/><text x="153" y="248" class="num">16</text>
    <rect x="290" y="205" width="870" height="86" rx="10" class="box cleanup"/>
    <text x="318" y="234" class="line1">EarlyDtb.cleanup()</text>
    <text x="318" y="265" class="line2">早期 DTB 解析对象退出服务，后续由正式 OF/DeviceTree 对象接续</text>
  </g>

  <rect x="290" y="2490" width="870" height="50" rx="10" class="stage"/>
  <text x="318" y="2515" class="boundary">终点边界：paging_init() 完成，MemBlock.Online，EarlyCon.Online，VM.Online</text>
</svg>

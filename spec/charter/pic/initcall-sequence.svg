<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120" role="img" aria-labelledby="title desc">
  <title id="title">initcall 期对象构建时序</title><desc id="desc">展示 InitcallPhase 中 do_basic_setup() 的有效调用顺序。</desc>
  <defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",Arial,sans-serif;fill:#0f172a}.title{font-size:30px;font-weight:600}.subtitle{font-size:19px;fill:#475569}.lane{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:8 6}.box{fill:#fff;stroke:#334155;stroke-width:1.2}.stage{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}.formal{fill:#ecfdf5;stroke:#10b981}.support{fill:#eff6ff;stroke:#3b82f6}.table{fill:#f5f3ff;stroke:#7c3aed}.trimmed{fill:#fff7ed;stroke:#f97316;stroke-dasharray:7 5}.deferred{fill:#fefce8;stroke:#ca8a04;stroke-dasharray:7 5}.obj{font-size:23px;font-weight:600;dominant-baseline:middle}.line1{font-size:21px;font-weight:600;dominant-baseline:middle}.line2{font-size:17px;fill:#475569;dominant-baseline:middle}.boundary{font-size:18px;font-weight:600;fill:#334155;dominant-baseline:middle}.num{font-size:17px;font-weight:600;fill:#fff;text-anchor:middle;dominant-baseline:middle}.timeline{stroke:#64748b;stroke-width:2;stroke-linecap:round}.dot{fill:#334155}</style></defs>
  <rect width="1280" height="1120" fill="#fff"/><text x="640" y="46" text-anchor="middle" class="title">initcall 期对象构建时序</text><text x="640" y="76" text-anchor="middle" class="subtitle">InitcallPhase.setup(): do_basic_setup()</text><rect x="48" y="126" width="214" height="940" rx="14" class="lane"/><text x="155" y="162" text-anchor="middle" class="obj">initcall 期</text><text x="155" y="188" text-anchor="middle" class="obj">InitcallPhase</text><line x1="155" y1="224" x2="155" y2="1030" class="timeline"/><rect x="292" y="116" width="876" height="52" rx="10" class="stage"/><text x="320" y="142" class="boundary">起点：RuntimeCorePhase 已 Ready；驱动与 initcall 表尚未全量运行</text>
  <g transform="translate(0 -48)"><g transform="translate(0 56)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">1</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">Cpuset.enable_smp(): cpuset_init_smp() trimmed/no-op</text><text x="320" y="260" class="line2">当前 CGROUPS=n，cpuset SMP 路径为空实现</text></g><g transform="translate(0 176)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">2</text><rect x="292" y="204" width="876" height="84" rx="10" class="box deferred"/><text x="320" y="232" class="line1">DriverCore.setup(): driver_init() deferred</text><text x="320" y="260" class="line2">保留驱动模型入口位置，内部对象层次后续 DriverCore 规格再展开</text></g><g transform="translate(0 296)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">3</text><rect x="292" y="204" width="876" height="84" rx="10" class="box deferred"/><text x="320" y="232" class="line1">IrqProcView.setup(): init_irq_proc() deferred</text><text x="320" y="260" class="line2">保留 /proc/irq 导出时序位置，当前不影响 IRQ dispatch 主线</text></g><g transform="translate(0 416)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">4</text><rect x="292" y="204" width="876" height="84" rx="10" class="box deferred"/><text x="320" y="232" class="line1">CtorTable.run(): do_ctors() conditional</text><text x="320" y="260" class="line2">按 CONFIG_CONSTRUCTORS 和 linker 表条目条件执行</text></g><g transform="translate(0 536)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">5</text><rect x="292" y="204" width="876" height="84" rx="10" class="box table"/><text x="320" y="232" class="line1">InitcallTable.run_all_levels(): do_initcalls()</text><text x="320" y="260" class="line2">基于 levels/entries 属性，逐项过滤、调用，并记录目标 operation 结果</text></g></g><rect x="292" y="980" width="876" height="52" rx="10" class="stage"/><text x="320" y="1006" class="boundary">终点：InitcallTable.levels[*] 已 Done；DriverCore/IrqProcView 保留入口；下一步 RootfsPhase</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2040" viewBox="0 0 1280 2040" role="img" aria-labelledby="title desc">
  <title id="title">中断开放后准备期对象构建时序</title>
  <desc id="desc">展示 Linux 6.12 以 `../linux-6.12/.config` 为基线的 start_kernel() 从 kmem_cache_init_late() 到 arch_cpu_finalize_init() 的有效调用顺序。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 600; }
      .subtitle { font-size: 19px; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .stage { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .formal { fill: #ecfdf5; stroke: #10b981; }
      .irq { fill: #f0fdfa; stroke: #14b8a6; }
      .mm { fill: #fefce8; stroke: #ca8a04; }
      .console { fill: #eff6ff; stroke: #3b82f6; }
      .time { fill: #fff7ed; stroke: #f97316; }
      .checkpoint { fill: #f5f3ff; stroke: #7c3aed; }
      .trimmed { fill: #fff7ed; stroke: #f97316; stroke-dasharray: 7 5; }
      .deferred { fill: #fefce8; stroke: #ca8a04; stroke-dasharray: 7 5; }
      .obj { font-size: 23px; font-weight: 600; dominant-baseline: middle; }
      .line1 { font-size: 21px; font-weight: 600; dominant-baseline: middle; }
      .line2 { font-size: 17px; fill: #475569; dominant-baseline: middle; }
      .boundary { font-size: 18px; font-weight: 600; fill: #334155; dominant-baseline: middle; }
      .num { font-size: 17px; font-weight: 600; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .timeline { stroke: #64748b; stroke-width: 2; stroke-linecap: round; }
      .dot { fill: #334155; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="2040" fill="#ffffff"/>
  <text x="640" y="46" text-anchor="middle" class="title">中断开放后准备期对象构建时序</text>
  <text x="640" y="76" text-anchor="middle" class="subtitle">IrqOpenPreparePhase.setup(): kmem_cache_init_late() 到 arch_cpu_finalize_init()</text>
  <rect x="48" y="126" width="214" height="1850" rx="14" class="lane"/>
  <text x="155" y="162" text-anchor="middle" class="obj">开放后准备期</text>
  <text x="155" y="188" text-anchor="middle" class="obj">IrqOpenPrepare</text>
  <line x1="155" y1="224" x2="155" y2="1940" class="timeline"/>
  <rect x="292" y="116" width="876" height="52" rx="10" class="stage"/>
  <text x="320" y="142" class="boundary">起点：IrqTimeInitPhase Ready；boot CPU 本地中断总入口已开放</text>

  <g transform="translate(0 -48)">
  <g transform="translate(0 56)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">1</text><rect x="292" y="204" width="876" height="84" rx="10" class="box mm"/><text x="320" y="232" class="line1">SlubSubsystem.setup_flush_workqueue(): kmem_cache_init_late()</text><text x="320" y="260" class="line2">创建 slub_flushwq 内部资源；不建立独立对象，SLUB FULL/Online 后置</text></g>
  <g transform="translate(0 156)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">2</text><rect x="292" y="204" width="876" height="84" rx="10" class="box console"/><text x="320" y="232" class="line1">Console.preset(): console_init()</text><text x="320" y="260" class="line2">注册 N_TTY line discipline，遍历静态 console initcall 表驱动 drivers early register</text></g>
  <g transform="translate(0 256)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">3</text><rect x="292" y="204" width="876" height="84" rx="10" class="box checkpoint"/><text x="320" y="232" class="line1">panic_later checkpoint</text><text x="320" y="260" class="line2">若早期参数异常被延迟记录，则在 console 可用后进入 fail boundary</text></g>
  <g transform="translate(0 356)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">4</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">lockdep_init(): trimmed/no-op</text><text x="320" y="260" class="line2">当前 CONFIG_LOCKDEP=n；未来启用后恢复为 Lockdep.setup()</text></g>
  <g transform="translate(0 456)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">5</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">locking_selftest(): trimmed/no-op</text><text x="320" y="260" class="line2">当前 DEBUG_LOCKING_API_SELFTESTS=n；启用后要求中断已经打开</text></g>
  <g transform="translate(0 556)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">6</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">InitrdBounds.check(): trimmed</text><text x="320" y="260" class="line2">当前 CONFIG_BLK_DEV_INITRD=n；启用后检查 initrd 是否被页分配器覆盖</text></g>
  <g transform="translate(0 656)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">7</text><rect x="292" y="204" width="876" height="84" rx="10" class="box deferred"/><text x="320" y="232" class="line1">PageAllocator.setup(): setup_per_cpu_pageset() deferred</text><text x="320" y="260" class="line2">保留 per-CPU pageset 缓存语义；当前不引入非标准 slot 或独立 Ready 状态</text></g>
  <g transform="translate(0 756)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">8</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">numa_policy_init(): trimmed/no-op</text><text x="320" y="260" class="line2">当前 CONFIG_NUMA=n；启用后恢复为 NumaPolicy.setup()</text></g>
  <g transform="translate(0 856)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">9</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">acpi_early_init(): trimmed/no-op</text><text x="320" y="260" class="line2">当前 CONFIG_ACPI=n；RISC-V 主线使用 DeviceTree 路径</text></g>
  <g transform="translate(0 956)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">10</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">late_time_init hook: trimmed/no-op</text><text x="320" y="260" class="line2">当前 RISC-V 未设置 hook；timer provider 已在前一阶段完成 setup</text></g>
  <g transform="translate(0 1056)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">11</text><rect x="292" y="204" width="876" height="84" rx="10" class="box time"/><text x="320" y="232" class="line1">SchedClock.setup(): sched_clock_init()</text><text x="320" y="260" class="line2">打开 sched_clock_running；必要时使用 jiffies fallback，并启动 sched_clock_timer</text></g>
  <g transform="translate(0 1156)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">12</text><rect x="292" y="204" width="876" height="84" rx="10" class="box time"/><text x="320" y="232" class="line1">DelayLoop.setup(): calibrate_delay()</text><text x="320" y="260" class="line2">消费 lpj_fine 建立 busy delay API 参数；udelay/ndelay/mdelay 是运行期 action</text></g>
  <g transform="translate(0 1256)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">13</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">arch_cpu_finalize_init(): trimmed/no-op</text><text x="320" y="260" class="line2">当前 RISC-V 未启用 ARCH_HAS_CPU_FINALIZE_INIT；下一步进入 pid_idr_init()</text></g>
  </g>

  <rect x="292" y="1880" width="876" height="52" rx="10" class="stage"/>
  <text x="320" y="1906" class="boundary">终点：boot CPU 已通过 sstatus.SIE 开放中断总入口；console、sched_clock 和 delay loop 已推进</text>
</svg>

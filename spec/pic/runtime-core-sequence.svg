<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1220" viewBox="0 0 1280 1220" role="img" aria-labelledby="title desc">
  <title id="title">运行核心补全期对象构建时序</title>
  <desc id="desc">展示 RuntimeCorePhase 从 sched_init_smp() 到 page_alloc_init_late() 的有效调用顺序。</desc>
  <defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",Arial,sans-serif;fill:#0f172a}.title{font-size:30px;font-weight:600}.subtitle{font-size:19px;fill:#475569}.lane{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:8 6}.box{fill:#fff;stroke:#334155;stroke-width:1.2}.stage{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}.core{fill:#f0fdfa;stroke:#14b8a6}.mm{fill:#fefce8;stroke:#ca8a04}.support{fill:#eff6ff;stroke:#3b82f6}.trimmed{fill:#fff7ed;stroke:#f97316;stroke-dasharray:7 5}.obj{font-size:23px;font-weight:600;dominant-baseline:middle}.line1{font-size:21px;font-weight:600;dominant-baseline:middle}.line2{font-size:17px;fill:#475569;dominant-baseline:middle}.boundary{font-size:18px;font-weight:600;fill:#334155;dominant-baseline:middle}.num{font-size:17px;font-weight:600;fill:#fff;text-anchor:middle;dominant-baseline:middle}.timeline{stroke:#64748b;stroke-width:2;stroke-linecap:round}.dot{fill:#334155}</style></defs>
  <rect width="1280" height="1220" fill="#fff"/><text x="640" y="46" text-anchor="middle" class="title">运行核心补全期对象构建时序</text><text x="640" y="76" text-anchor="middle" class="subtitle">RuntimeCorePhase.setup(): sched_init_smp() 到 page_alloc_init_late()</text>
  <rect x="48" y="126" width="214" height="1040" rx="14" class="lane"/><text x="155" y="162" text-anchor="middle" class="obj">运行核心补全期</text><text x="155" y="188" text-anchor="middle" class="obj">RuntimeCorePhase</text><line x1="155" y1="224" x2="155" y2="1130" class="timeline"/>
  <rect x="292" y="116" width="876" height="52" rx="10" class="stage"/><text x="320" y="142" class="boundary">起点：SmpBringupPhase 已 Ready；secondary CPU 已 online</text>
  <g transform="translate(0 -48)">
  <g transform="translate(0 56)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">1</text><rect x="292" y="204" width="876" height="84" rx="10" class="box core"/><text x="320" y="232" class="line1">Scheduler.enable_smp() action: sched_init_smp()</text><text x="320" y="260" class="line2">补齐 SMP 调度能力，解除 PID 1 亲和限制，初始化 RT/DL SMP 后置状态</text></g>
  <g transform="translate(0 176)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">2</text><rect x="292" y="204" width="876" height="84" rx="10" class="box core"/><text x="320" y="232" class="line1">Workqueue.enable(): workqueue_init_topology()</text><text x="320" y="260" class="line2">第三阶段初始化，补齐 unbound workqueue 拓扑能力并进入 Online</text></g>
  <g transform="translate(0 296)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">3</text><rect x="292" y="204" width="876" height="84" rx="10" class="box support"/><text x="320" y="232" class="line1">AsyncCore.setup(): async_init()</text><text x="320" y="260" class="line2">创建 async unbound workqueue，并设置更高 min_active</text></g>
  <g transform="translate(0 416)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">4</text><rect x="292" y="204" width="876" height="84" rx="10" class="box support"/><text x="320" y="232" class="line1">PadataCore.setup(): padata_init()</text><text x="320" y="260" class="line2">登记 padata CPU hotplug state，分配 possible CPU 数量的 padata work</text></g>
  <g transform="translate(0 536)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">5</text><rect x="292" y="204" width="876" height="84" rx="10" class="box mm"/><text x="320" y="232" class="line1">PageAllocator.enable(): page_alloc_init_late()</text><text x="320" y="260" class="line2">内存统计、buffer init、memblock discard、zone contiguous 与 sysctl</text></g>
  <g transform="translate(0 656)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">6</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">DeferredStructPageInit / PageExtension: trimmed/no-op</text><text x="320" y="260" class="line2">当前未启用 deferred struct page init 与 page extension</text></g>
  </g>
  <rect x="292" y="1080" width="876" height="52" rx="10" class="stage"/><text x="320" y="1106" class="boundary">终点：调度、workqueue、async、padata 和 page allocator late 已补全；下一步 do_basic_setup()</text>
</svg>

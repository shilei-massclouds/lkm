<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Scheduler Init Objects</title>
  <desc id="desc">Shows BootPhase subphase 5 object boundaries for Linux 6.12.37 default_config from after mm_core_init() to context_tracking_init().</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 600; }
      .subtitle { font-size: 18px; fill: #475569; }
      .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .phase { fill: #eef2ff; stroke: #6366f1; }
      .ready { fill: #ecfdf5; stroke: #10b981; }
      .sched { fill: #f0fdf4; stroke: #22c55e; }
      .async { fill: #eff6ff; stroke: #3b82f6; }
      .trace { fill: #f5f3ff; stroke: #7c3aed; }
      .checkpoint { fill: #f1f5f9; stroke: #64748b; stroke-dasharray: 6 4; }
      .label { font-size: 20px; font-weight: 600; dominant-baseline: middle; }
      .small { font-size: 15px; fill: #475569; dominant-baseline: middle; }
      .group-title { font-size: 20px; font-weight: 600; fill: #334155; }
      .edge { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="760" fill="#ffffff"/>
  <text x="640" y="46" text-anchor="middle" class="title">Scheduler Init Objects</text>
  <text x="640" y="76" text-anchor="middle" class="subtitle">BootPhase subphase 5: after mm_core_init() to context_tracking_init()</text>

  <rect x="50" y="116" width="235" height="584" rx="14" class="group"/>
  <text x="168" y="150" text-anchor="middle" class="group-title">Phase Boundary</text>
  <rect x="82" y="186" width="172" height="72" rx="8" class="box phase"/>
  <text x="168" y="214" text-anchor="middle" class="label">SchedulerInit</text>
  <text x="168" y="238" text-anchor="middle" class="small">Subphase</text>
  <rect x="82" y="304" width="172" height="72" rx="8" class="box ready"/>
  <text x="168" y="332" text-anchor="middle" class="label">MmCoreInit</text>
  <text x="168" y="356" text-anchor="middle" class="small">Ready input</text>
  <rect x="82" y="422" width="172" height="72" rx="8" class="box phase"/>
  <text x="168" y="450" text-anchor="middle" class="label">ContextTracking</text>
  <text x="168" y="474" text-anchor="middle" class="small">End point</text>
  <path d="M168 304 L168 264" class="edge"/>
  <path d="M168 422 L168 382" class="edge"/>

  <rect x="320" y="116" width="420" height="584" rx="14" class="group"/>
  <text x="530" y="150" text-anchor="middle" class="group-title">Trace and Scheduler Core</text>
  <rect x="350" y="184" width="160" height="72" rx="8" class="box checkpoint"/>
  <text x="430" y="212" text-anchor="middle" class="label">TextPoking</text>
  <text x="430" y="236" text-anchor="middle" class="small">RISC-V no-op</text>
  <rect x="550" y="184" width="160" height="72" rx="8" class="box trace"/>
  <text x="630" y="212" text-anchor="middle" class="label">FunctionTracer</text>
  <text x="630" y="236" text-anchor="middle" class="small">ftrace_init</text>
  <rect x="350" y="310" width="160" height="72" rx="8" class="box trace"/>
  <text x="430" y="338" text-anchor="middle" class="label">EarlyTrace</text>
  <text x="430" y="362" text-anchor="middle" class="small">trace buffers</text>
  <rect x="550" y="310" width="160" height="72" rx="8" class="box sched"/>
  <text x="630" y="338" text-anchor="middle" class="label">Scheduler</text>
  <text x="630" y="362" text-anchor="middle" class="small">boot CPU runqueue</text>
  <rect x="450" y="486" width="180" height="72" rx="8" class="box sched"/>
  <text x="540" y="514" text-anchor="middle" class="label">KernelCollections</text>
  <text x="540" y="538" text-anchor="middle" class="small">radix + maple</text>

  <rect x="775" y="116" width="455" height="584" rx="14" class="group"/>
  <text x="1002" y="150" text-anchor="middle" class="group-title">Async Foundations</text>
  <rect x="805" y="184" width="176" height="72" rx="8" class="box async"/>
  <text x="893" y="212" text-anchor="middle" class="label">Housekeeping</text>
  <text x="893" y="236" text-anchor="middle" class="small">CPU masks</text>
  <rect x="1018" y="184" width="176" height="72" rx="8" class="box async"/>
  <text x="1106" y="212" text-anchor="middle" class="label">WorkqueueEarly</text>
  <text x="1106" y="236" text-anchor="middle" class="small">queue/cancel only</text>
  <rect x="805" y="310" width="176" height="72" rx="8" class="box async"/>
  <text x="893" y="338" text-anchor="middle" class="label">RCU</text>
  <text x="893" y="362" text-anchor="middle" class="small">TREE_RCU</text>
  <rect x="1018" y="310" width="176" height="72" rx="8" class="box trace"/>
  <text x="1106" y="338" text-anchor="middle" class="label">TraceEvents</text>
  <text x="1106" y="362" text-anchor="middle" class="small">trace_init</text>
  <rect x="912" y="486" width="176" height="72" rx="8" class="box checkpoint"/>
  <text x="1000" y="514" text-anchor="middle" class="label">ContextTracking</text>
  <text x="1000" y="538" text-anchor="middle" class="small">current no-op/checkpoint</text>

  <path d="M254 222 C286 222, 304 220, 348 220" class="edge"/>
  <path d="M510 220 L548 220" class="edge"/>
  <path d="M630 256 C630 278, 570 300, 510 338" class="edge"/>
  <path d="M510 346 L548 346" class="edge"/>
  <path d="M630 382 C630 430, 585 456, 540 484" class="edge"/>
  <path d="M630 522 C706 522, 742 220, 803 220" class="edge"/>
  <path d="M981 220 L1016 220" class="edge"/>
  <path d="M1106 256 C1106 290, 1010 318, 981 346" class="edge"/>
  <path d="M981 346 L1016 346" class="edge"/>
  <path d="M1106 382 C1106 432, 1048 458, 1000 484" class="edge"/>
</svg>

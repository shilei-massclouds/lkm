<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">Scheduler Init Objects</title>
  <desc id="desc">Shows BootPhase subphase 5 object boundaries for Linux 6.12.37 default_config with Linux tracing deferred.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 600; }
      .subtitle { font-size: 18px; fill: #475569; }
      .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .phase { fill: #eef2ff; stroke: #6366f1; }
      .ready { fill: #ecfdf5; stroke: #10b981; }
      .sched { fill: #f0fdf4; stroke: #22c55e; }
      .async { fill: #eff6ff; stroke: #3b82f6; }
      .checkpoint { fill: #f1f5f9; stroke: #64748b; stroke-dasharray: 6 4; }
      .deferred { fill: #f1f5f9; stroke: #64748b; stroke-dasharray: 6 4; }
      .label { font-size: 20px; font-weight: 600; dominant-baseline: middle; }
      .small { font-size: 15px; fill: #475569; dominant-baseline: middle; }
      .group-title { font-size: 20px; font-weight: 600; fill: #334155; }
      .edge { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="700" fill="#ffffff"/>
  <text x="640" y="46" text-anchor="middle" class="title">Scheduler Init Objects</text>
  <text x="640" y="76" text-anchor="middle" class="subtitle">BootPhase subphase 5: scheduler, collections, workqueue, and RCU</text>

  <rect x="50" y="116" width="235" height="524" rx="14" class="group"/>
  <text x="168" y="150" text-anchor="middle" class="group-title">Phase Boundary</text>
  <rect x="82" y="186" width="172" height="72" rx="8" class="box phase"/>
  <text x="168" y="214" text-anchor="middle" class="label">SchedulerInit</text>
  <text x="168" y="238" text-anchor="middle" class="small">Subphase</text>
  <rect x="82" y="304" width="172" height="72" rx="8" class="box ready"/>
  <text x="168" y="332" text-anchor="middle" class="label">MmCoreInit</text>
  <text x="168" y="356" text-anchor="middle" class="small">Ready input</text>
  <rect x="82" y="422" width="172" height="72" rx="8" class="box checkpoint"/>
  <text x="168" y="450" text-anchor="middle" class="label">InitcallDebug</text>
  <text x="168" y="474" text-anchor="middle" class="small">exit checkpoint</text>
  <path d="M168 304 L168 264" class="edge"/>
  <path d="M168 422 L168 382" class="edge"/>

  <rect x="320" y="116" width="420" height="524" rx="14" class="group"/>
  <text x="530" y="150" text-anchor="middle" class="group-title">Scheduler Core</text>
  <rect x="350" y="206" width="160" height="72" rx="8" class="box sched"/>
  <text x="430" y="234" text-anchor="middle" class="label">Scheduler</text>
  <text x="430" y="258" text-anchor="middle" class="small">boot CPU runqueue</text>
  <rect x="550" y="206" width="160" height="72" rx="8" class="box sched"/>
  <text x="630" y="234" text-anchor="middle" class="label">KernelCollections</text>
  <text x="630" y="258" text-anchor="middle" class="small">radix + maple</text>

  <rect x="775" y="116" width="455" height="524" rx="14" class="group"/>
  <text x="1002" y="150" text-anchor="middle" class="group-title">Async Foundations</text>
  <rect x="805" y="184" width="176" height="72" rx="8" class="box async"/>
  <text x="893" y="212" text-anchor="middle" class="label">Housekeeping</text>
  <text x="893" y="236" text-anchor="middle" class="small">CPU masks</text>
  <rect x="1018" y="184" width="176" height="72" rx="8" class="box async"/>
  <text x="1106" y="212" text-anchor="middle" class="label">WorkqueueEarly</text>
  <text x="1106" y="236" text-anchor="middle" class="small">queue/cancel only</text>
  <rect x="912" y="330" width="176" height="72" rx="8" class="box async"/>
  <text x="1000" y="358" text-anchor="middle" class="label">RCU</text>
  <text x="1000" y="382" text-anchor="middle" class="small">TREE_RCU</text>
  <rect x="450" y="462" width="236" height="72" rx="8" class="box deferred"/>
  <text x="568" y="490" text-anchor="middle" class="label">LinuxTracing</text>
  <text x="568" y="514" text-anchor="middle" class="small">preset/setup deferred</text>

  <path d="M254 222 C286 222, 304 242, 348 242" class="edge"/>
  <path d="M510 242 L548 242" class="edge"/>
  <path d="M710 242 C750 242, 766 220, 803 220" class="edge"/>
  <path d="M981 220 L1016 220" class="edge"/>
  <path d="M1106 256 C1106 292, 1050 316, 1000 328" class="edge"/>
  <path d="M1000 402 C1000 444, 558 474, 254 458" class="edge"/>
</svg>

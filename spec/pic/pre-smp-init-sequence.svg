<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1720" viewBox="0 0 1280 1720" role="img" aria-labelledby="title desc">
  <title id="title">SMP 前初始化期对象构建时序</title>
  <desc id="desc">展示 Linux 6.12 以 `../linux-6.12/.config` 为基线的 kernel_init_freeable() 从 gfp_allowed_mask 到 smp_init() 前的有效调用顺序。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 600; }
      .subtitle { font-size: 19px; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .stage { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .formal { fill: #ecfdf5; stroke: #10b981; }
      .mm { fill: #fefce8; stroke: #ca8a04; }
      .sched { fill: #f0fdfa; stroke: #14b8a6; }
      .sync { fill: #f5f3ff; stroke: #7c3aed; }
      .support { fill: #eff6ff; stroke: #3b82f6; }
      .deferred { fill: #fefce8; stroke: #ca8a04; stroke-dasharray: 7 5; }
      .trimmed { fill: #fff7ed; stroke: #f97316; stroke-dasharray: 7 5; }
      .obj { font-size: 23px; font-weight: 600; dominant-baseline: middle; }
      .line1 { font-size: 21px; font-weight: 600; dominant-baseline: middle; }
      .line2 { font-size: 17px; fill: #475569; dominant-baseline: middle; }
      .boundary { font-size: 18px; font-weight: 600; fill: #334155; dominant-baseline: middle; }
      .num { font-size: 17px; font-weight: 600; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .timeline { stroke: #64748b; stroke-width: 2; stroke-linecap: round; }
      .dot { fill: #334155; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="1720" fill="#ffffff"/>
  <text x="640" y="46" text-anchor="middle" class="title">SMP 前初始化期对象构建时序</text>
  <text x="640" y="76" text-anchor="middle" class="subtitle">PreSmpInitPhase.setup(): kernel_init_freeable() 到 smp_init() 前</text>
  <rect x="48" y="126" width="214" height="1520" rx="14" class="lane"/>
  <text x="155" y="162" text-anchor="middle" class="obj">SMP 前初始化</text>
  <text x="155" y="188" text-anchor="middle" class="obj">PreSmpInitPhase</text>
  <line x1="155" y1="224" x2="155" y2="1610" class="timeline"/>
  <rect x="292" y="116" width="876" height="52" rx="10" class="stage"/>
  <text x="320" y="142" class="boundary">起点：PID 1 released/dispatched；Scheduler 首次 handoff 已提交；secondary CPU 尚未启动</text>

  <g transform="translate(0 -48)">
  <g transform="translate(0 56)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">1</text><rect x="292" y="204" width="876" height="84" rx="10" class="box mm"/><text x="320" y="232" class="line1">PageAllocator.open_full_gfp_mask(): gfp_allowed_mask = __GFP_BITS_MASK</text><text x="320" y="260" class="line2">打开 PageAllocator 全局 GFP mask，后续初始化可使用阻塞分配</text></g>
  <g transform="translate(0 176)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">2</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">set_mems_allowed(node_states[N_MEMORY]): trimmed/no-op</text><text x="320" y="260" class="line2">当前 CPUSETS=n 且 NUMA=n；裁剪路径不展开对象建模</text></g>
  <g transform="translate(0 296)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">3</text><rect x="292" y="204" width="876" height="84" rx="10" class="box deferred"/><text x="320" y="232" class="line1">cad_pid = get_pid(task_pid(current)): deferred</text><text x="320" y="260" class="line2">reboot/ctrl-alt-del 全局引用绑定，留给系统控制路径讨论</text></g>
  <g transform="translate(0 416)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">4</text><rect x="292" y="204" width="876" height="84" rx="10" class="box sched"/><text x="320" y="232" class="line1">CpuGroup/CpuTopology: smp_prepare_cpus(setup_max_cpus)</text><text x="320" y="260" class="line2">CpuTopology.setup/record(BootCPU)，并写 secondary CPU present 属性</text></g>
  <g transform="translate(0 536)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">5</text><rect x="292" y="204" width="876" height="84" rx="10" class="box sched"/><text x="320" y="232" class="line1">Workqueue.setup(): workqueue_init()</text><text x="320" y="260" class="line2">创建 rescuer、BH/CPU/unbound 初始 worker，补齐 pool node hint，并初始化 WQ watchdog</text></g>
  <g transform="translate(0 656)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">6</text><rect x="292" y="204" width="876" height="84" rx="10" class="box mm"/><text x="320" y="232" class="line1">VmstatCore.preset(): init_mm_internals()</text><text x="320" y="260" class="line2">创建 mm_percpu_wq，注册 hotplug state，并启动 shepherd delayed work</text></g>
  <g transform="translate(0 776)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">7</text><rect x="292" y="204" width="876" height="84" rx="10" class="box deferred"/><text x="320" y="232" class="line1">VmstatProcExports: proc_create_seq() deferred</text><text x="320" y="260" class="line2">buddyinfo、pagetypeinfo、vmstat、zoneinfo 的 procfs 导出暂不推进对象状态</text></g>
  <g transform="translate(0 896)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">8</text><rect x="292" y="204" width="876" height="84" rx="10" class="box sync"/><text x="320" y="232" class="line1">TasksRcu.setup(): rcu_init_tasks_generic()</text><text x="320" y="260" class="line2">为已启用 flavor 创建 GP kthread；PROVE_RCU 时启动 self-test</text></g>
  <g transform="translate(0 1016)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">9</text><rect x="292" y="204" width="876" height="84" rx="10" class="box support"/><text x="320" y="232" class="line1">PreSmpInitcallTable.run_early(): do_pre_smp_initcalls()</text><text x="320" y="260" class="line2">驱动 RCU GP、ksoftirqd、migration/cpustop、ASID 与 zero_pfn</text></g>
  <g transform="translate(0 1136)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">10</text><rect x="292" y="204" width="876" height="84" rx="10" class="box deferred"/><text x="320" y="232" class="line1">LockupDetector: lockup_detector_init() deferred</text><text x="320" y="260" class="line2">诊断/watchdog 路径；watchdog_cpumask 默认来自 Housekeeping timer mask</text></g>
  <g transform="translate(0 1256)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">11</text><rect x="292" y="204" width="876" height="84" rx="10" class="box stage"/><text x="320" y="232" class="line1">smp_init(): 下一阶段入口</text><text x="320" y="260" class="line2">本调用不属于 PreSmpInitPhase；执行后进入 SMP Runtime Phase</text></g>
  </g>

  <rect x="292" y="1560" width="876" height="52" rx="10" class="stage"/>
  <text x="320" y="1586" class="boundary">终点：阻塞分配、workqueue、vmstat、Tasks RCU 和 early initcalls 已准备；等待 smp_init()</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">Flow、Context、句柄链与对象</title>
  <desc id="desc">三个 Flow 分别处于上下文 A、B、C 中，通过不同层级的句柄访问同一个对象实例。句柄 2 包装到句柄 1，句柄 1 包装到句柄 0，句柄 0 最终访问对象。</desc>
  <defs>
    <style>
      .title { font: 700 24px "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .context { fill: #ffffff; stroke: #374151; stroke-width: 2; stroke-dasharray: 9 7; }
      .flow { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .handle { fill: #f8fafc; stroke: #111827; stroke-width: 2; }
      .handle2 { fill: #ecfdf5; stroke: #059669; }
      .handle1 { fill: #fffbeb; stroke: #d97706; }
      .handle0 { fill: #f5f3ff; stroke: #7c3aed; }
      .object { fill: #f9fafb; stroke: #111827; stroke-width: 2.5; }
      .label { font: 700 20px "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 600 15px "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #374151; text-anchor: middle; dominant-baseline: middle; }
      .muted { font: 600 14px "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #6b7280; text-anchor: middle; dominant-baseline: middle; }
      .arrow { fill: none; stroke: #111827; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .dotted { fill: none; stroke: #4b5563; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 4 8; marker-end: url(#arrow-muted); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="620" fill="#ffffff"/>
  <text x="540" y="36" class="title" text-anchor="middle">Flow, Context, Handle Chain, Object</text>

  <rect x="70" y="70" width="260" height="275" rx="14" ry="14" class="context"/>
  <rect x="390" y="70" width="260" height="355" rx="14" ry="14" class="context"/>
  <rect x="710" y="70" width="260" height="435" rx="14" ry="14" class="context"/>

  <text x="200" y="96" class="label">Context A</text>
  <text x="520" y="96" class="label">Context B</text>
  <text x="840" y="96" class="label">Context C</text>

  <rect x="120" y="122" width="160" height="58" rx="10" ry="10" class="flow"/>
  <rect x="440" y="122" width="160" height="58" rx="10" ry="10" class="flow"/>
  <rect x="760" y="122" width="160" height="58" rx="10" ry="10" class="flow"/>
  <text x="200" y="146" class="label">Flow A</text>
  <text x="200" y="168" class="small">runs in Context A</text>
  <text x="520" y="146" class="label">Flow B</text>
  <text x="520" y="168" class="small">runs in Context B</text>
  <text x="840" y="146" class="label">Flow C</text>
  <text x="840" y="168" class="small">runs in Context C</text>

  <rect x="90" y="242" width="240" height="72" rx="12" ry="12" class="handle handle2"/>
  <text x="210" y="268" class="label">Handle 2</text>
  <text x="210" y="294" class="small">Context-A restricted handle</text>

  <rect x="90" y="340" width="560" height="72" rx="12" ry="12" class="handle handle1"/>
  <text x="370" y="366" class="label">Handle 1</text>
  <text x="370" y="392" class="small">shared lower-level access handle</text>

  <rect x="90" y="438" width="880" height="72" rx="12" ry="12" class="handle handle0"/>
  <text x="530" y="464" class="label">Handle 0</text>
  <text x="530" y="490" class="small">base handle near the object, not a naked Flow reference</text>

  <rect x="90" y="525" width="880" height="48" rx="12" ry="12" class="object"/>
  <text x="530" y="549" class="label">Object Instance / Resource Object</text>

  <path d="M 200 180 C 200 206, 210 218, 210 242" class="dotted"/>
  <path d="M 520 180 C 520 252, 420 278, 370 340" class="dotted"/>
  <path d="M 840 180 C 840 322, 700 382, 530 438" class="dotted"/>

  <path d="M 210 314 C 210 330, 270 330, 315 340" class="arrow"/>
  <path d="M 370 412 C 370 426, 445 426, 500 438" class="arrow"/>
  <path d="M 530 510 L 530 525" class="arrow"/>

  <text x="248" y="330" class="muted">wrap / narrow</text>
  <text x="444" y="428" class="muted">delegate / convert</text>
  <text x="612" y="520" class="muted">final access</text>

  <text x="835" y="600" class="muted">dotted: Flow obtains handle; solid: handle chain descends</text>
</svg>

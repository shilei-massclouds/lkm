<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2440" viewBox="0 0 1280 2440" role="img" aria-labelledby="title desc">
  <title id="title">中断时间准备期对象构建时序</title>
  <desc id="desc">展示 Linux 6.12.37 default_config 下 start_kernel() 从 early_irq_init() 到 local_irq_enable() 前的有效调用顺序及规格补充动作。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 600; }
      .subtitle { font-size: 19px; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .stage { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .formal { fill: #ecfdf5; stroke: #10b981; }
      .irq { fill: #f0fdfa; stroke: #14b8a6; }
      .time { fill: #fff7ed; stroke: #f97316; }
      .checkpoint { fill: #f5f3ff; stroke: #7c3aed; }
      .deferred { fill: #f8fafc; stroke: #94a3b8; stroke-dasharray: 7 5; }
      .obj { font-size: 23px; font-weight: 600; dominant-baseline: middle; }
      .line1 { font-size: 21px; font-weight: 600; dominant-baseline: middle; }
      .line2 { font-size: 17px; fill: #475569; dominant-baseline: middle; }
      .boundary { font-size: 18px; font-weight: 600; fill: #334155; dominant-baseline: middle; }
      .num { font-size: 17px; font-weight: 600; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .timeline { stroke: #64748b; stroke-width: 2; stroke-linecap: round; }
      .dot { fill: #334155; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="2440" fill="#ffffff"/>
  <text x="640" y="46" text-anchor="middle" class="title">中断时间准备期对象构建时序</text>
  <text x="640" y="76" text-anchor="middle" class="subtitle">IrqTimeInitPhase.setup(): early_irq_init() 到 local_irq_enable() 前，Softirq 已 Prepared</text>
  <rect x="48" y="126" width="214" height="2250" rx="14" class="lane"/>
  <text x="155" y="162" text-anchor="middle" class="obj">中断时间</text>
  <text x="155" y="188" text-anchor="middle" class="obj">准备期</text>
  <line x1="155" y1="224" x2="155" y2="2340" class="timeline"/>
  <rect x="292" y="116" width="876" height="52" rx="10" class="stage"/>
  <text x="320" y="142" class="boundary">起点：SchedInitPhase 完成；中断仍保持关闭</text>

  <g transform="translate(0 -48)">
  <g transform="translate(0 56)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">1</text><rect x="292" y="204" width="876" height="84" rx="10" class="box irq"/><text x="320" y="232" class="line1">IrqDispatchTree.preset(): early_irq_init()</text><text x="320" y="260" class="line2">建立 IRQ 编号空间、默认 affinity 和 early IRQ 基础，进入 Prepared</text></g>
  <g transform="translate(0 156)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">2</text><rect x="292" y="204" width="876" height="84" rx="10" class="box irq"/><text x="320" y="232" class="line1">IrqDispatchTree.setup(): init_IRQ()</text><text x="320" y="260" class="line2">建立 IrqDomain/IrqChip/架构入口，并驱动 SbiIpi.preset/setup</text></g>
  <g transform="translate(0 256)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">3</text><rect x="292" y="204" width="876" height="84" rx="10" class="box time"/><text x="320" y="232" class="line1">Tick.preset(): tick_init()</text><text x="320" y="260" class="line2">建立 TickBroadcast masks；NO_HZ_FULL 当前 trimmed/no-op</text></g>
  <g transform="translate(0 356)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">4</text><rect x="292" y="204" width="876" height="84" rx="10" class="box checkpoint"/><text x="320" y="232" class="line1">rcu_init_nohz(): trimmed/no-op</text><text x="320" y="260" class="line2">CONFIG_RCU_NOCB_CPU=n 且 NO_HZ_FULL=n；RcuCore 保持 Ready</text></g>
  <g transform="translate(0 456)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">5</text><rect x="292" y="204" width="876" height="84" rx="10" class="box time"/><text x="320" y="232" class="line1">TimerWheel.setup(): init_timers()</text><text x="320" y="260" class="line2">建立 CpuTimerBases[*]、POSIX CPU timer work，并注册 TIMER_SOFTIRQ</text></g>
  <g transform="translate(0 556)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">6</text><rect x="292" y="204" width="876" height="84" rx="10" class="box deferred"/><text x="320" y="232" class="line1">srcu_init(): deferred</text><text x="320" y="260" class="line2">CONFIG_TREE_SRCU=y；有用但当前暂不展开 Srcu.setup()</text></g>
  <g transform="translate(0 656)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">7</text><rect x="292" y="204" width="876" height="84" rx="10" class="box time"/><text x="320" y="232" class="line1">HrtimerCore.setup(): hrtimers_init()</text><text x="320" y="260" class="line2">准备 boot CPU hrtimer base；实例由使用者拥有，并注册 HRTIMER_SOFTIRQ</text></g>
  <g transform="translate(0 756)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">8</text><rect x="292" y="204" width="876" height="84" rx="10" class="box irq"/><text x="320" y="232" class="line1">Softirq.setup(): softirq_init()</text><text x="320" y="260" class="line2">建立 tasklet 队列并注册 TASKLET / HI softirq；执行仍 deferred</text></g>
  <g transform="translate(0 856)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">9</text><rect x="292" y="204" width="876" height="84" rx="10" class="box time"/><text x="320" y="232" class="line1">Timekeeper.setup(): timekeeping_init()</text><text x="320" y="260" class="line2">驱动 JiffiesClocksource.preset，并初始化 tk_core / fast / shadow</text></g>
  <g transform="translate(0 956)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">10</text><rect x="292" y="204" width="876" height="84" rx="10" class="box time"/><text x="320" y="232" class="line1">RiscvTimerProvider.setup(): time_init()</text><text x="320" y="260" class="line2">probe clk/timer，注册 clocksource/clockevent，并补完 Tick.setup()</text></g>
  <g transform="translate(0 1056)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">11</text><rect x="292" y="204" width="876" height="84" rx="10" class="box formal"/><text x="320" y="232" class="line1">Randomness.setup(): random_init()</text><text x="320" y="260" class="line2">混入时间/cycle/latent entropy，处理 CRNG ready/reseed，进入 Ready</text></g>
  <g transform="translate(0 1156)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">12</text><rect x="292" y="204" width="876" height="84" rx="10" class="box formal"/><text x="320" y="232" class="line1">BootInitTask.refresh_stack_canary(): boot_init_stack_canary()</text><text x="320" y="260" class="line2">基于完整 RNG 刷新 current.stack_canary；不推进对象状态</text></g>
  <g transform="translate(0 1256)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">13</text><rect x="292" y="204" width="876" height="84" rx="10" class="box deferred"/><text x="320" y="232" class="line1">perf_event_init(): deferred</text><text x="320" y="260" class="line2">CONFIG_PERF_EVENTS=y；有实质初始化，但非当前最小启动关键路径</text></g>
  <g transform="translate(0 1356)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">14</text><rect x="292" y="204" width="876" height="84" rx="10" class="box deferred"/><text x="320" y="232" class="line1">profile_init(): deferred</text><text x="320" y="260" class="line2">默认未启用 profile=；后续恢复为 KernelProfiler.setup()</text></g>
  <g transform="translate(0 1456)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">15</text><rect x="292" y="204" width="876" height="84" rx="10" class="box formal"/><text x="320" y="232" class="line1">SmpCallFunction.setup(): call_function_init()</text><text x="320" y="260" class="line2">初始化 call_single_queue[*] 和 boot CPU call data，关联 IPI_CALL_FUNC</text></g>
  <g transform="translate(0 1556)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">16</text><rect x="292" y="204" width="876" height="84" rx="10" class="box checkpoint"/><text x="320" y="232" class="line1">Exit checkpoint</text><text x="320" y="260" class="line2">IRQ/time 控制设施 Ready；boot CPU 本地中断仍关闭</text></g>
  <g transform="translate(0 1656)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">→</text><rect x="292" y="204" width="876" height="84" rx="10" class="box irq"/><text x="320" y="232" class="line1">Next: LocalIrqEnablePhase</text><text x="320" y="260" class="line2">确认 IRQ 仍关闭，然后执行 local_irq_enable()</text></g>
  </g>

  <rect x="292" y="2280" width="876" height="52" rx="10" class="stage"/>
  <text x="320" y="2306" class="boundary">终点：boot CPU 本地中断仍关闭；IRQ/time、softirq、RNG、SbiIpi 与 SmpCallFunction 均 Ready</text>
</svg>

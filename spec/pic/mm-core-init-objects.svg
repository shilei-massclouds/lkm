<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">内存核心初始化期对象分类与相互关系</title>
  <desc id="desc">展示 BootPhase 子阶段 4 对应 Linux 6.12.37 default_config 下 mm_core_init() 的对象边界、主线对象和裁剪路径。</desc>
  <defs>
    <style>
      text {
        font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", Arial, sans-serif;
        fill: #0f172a;
      }
      .title { font-size: 30px; font-weight: 600; }
      .subtitle { font-size: 18px; fill: #475569; }
      .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .phase { fill: #eef2ff; stroke: #6366f1; }
      .ready { fill: #ecfdf5; stroke: #10b981; }
      .memory { fill: #f0fdf4; stroke: #22c55e; }
      .topology { fill: #f0fdfa; stroke: #14b8a6; }
      .alloc { fill: #eff6ff; stroke: #3b82f6; }
      .debug { fill: #fff7ed; stroke: #f97316; }
      .trimmed { fill: #f1f5f9; stroke: #64748b; stroke-dasharray: 6 4; }
      .label { font-size: 21px; font-weight: 600; dominant-baseline: middle; }
      .small { font-size: 16px; fill: #475569; dominant-baseline: middle; }
      .tiny { font-size: 14px; fill: #64748b; dominant-baseline: middle; }
      .group-title { font-size: 20px; font-weight: 600; fill: #334155; }
      .edge { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="900" fill="#ffffff"/>
  <text x="640" y="46" text-anchor="middle" class="title">内存核心初始化期对象分类与相互关系</text>
  <text x="640" y="76" text-anchor="middle" class="subtitle">BootPhase 子阶段 4：trap_init() 完成后到 mm_core_init() 返回；基线配置为 linux-6.12.37/default_config</text>

  <rect x="50" y="116" width="250" height="724" rx="14" class="group"/>
  <text x="175" y="150" text-anchor="middle" class="group-title">阶段边界</text>
  <rect x="82" y="186" width="186" height="72" rx="8" class="box phase"/>
  <text x="175" y="214" text-anchor="middle" class="label">MmCoreInitPhase</text>
  <text x="175" y="238" text-anchor="middle" class="small">mm_core_init()</text>
  <rect x="82" y="306" width="186" height="72" rx="8" class="box ready"/>
  <text x="175" y="334" text-anchor="middle" class="label">CorePreparePhase</text>
  <text x="175" y="358" text-anchor="middle" class="small">Ready 输入</text>
  <rect x="82" y="426" width="186" height="72" rx="8" class="box ready"/>
  <text x="175" y="454" text-anchor="middle" class="label">SystemExclusive</text>
  <text x="175" y="478" text-anchor="middle" class="small">中断/调度未开放</text>
  <path d="M175 306 L175 264" class="edge"/>
  <path d="M175 426 L175 384" class="edge"/>

  <rect x="332" y="116" width="396" height="724" rx="14" class="group"/>
  <text x="530" y="150" text-anchor="middle" class="group-title">主线内存对象</text>

  <rect x="356" y="184" width="348" height="198" rx="8" class="box topology"/>
  <text x="530" y="212" text-anchor="middle" class="label">MemoryTopology</text>
  <text x="530" y="236" text-anchor="middle" class="small">CONFIG_NUMA=n: MemoryNode[0]</text>
  <rect x="384" y="264" width="292" height="88" rx="8" class="box memory"/>
  <text x="530" y="290" text-anchor="middle" class="small">MemoryNode owns ZoneSet + ZonelistSet</text>
  <rect x="402" y="314" width="118" height="28" rx="6" class="box ready"/>
  <text x="461" y="329" text-anchor="middle" class="tiny">ZoneSet</text>
  <rect x="540" y="314" width="118" height="28" rx="6" class="box ready"/>
  <text x="599" y="329" text-anchor="middle" class="tiny">ZonelistSet</text>
  <text x="530" y="366" text-anchor="middle" class="tiny">Zoneref[] references Zone; does not own Zone</text>

  <rect x="364" y="420" width="160" height="72" rx="8" class="box memory"/>
  <text x="444" y="448" text-anchor="middle" class="label">PageAllocator</text>
  <text x="444" y="472" text-anchor="middle" class="small">zonelist + memblock</text>
  <rect x="540" y="420" width="156" height="72" rx="8" class="box memory"/>
  <text x="618" y="448" text-anchor="middle" class="label">SlubSubsystem</text>
  <text x="618" y="472" text-anchor="middle" class="small">SLUB + kmalloc</text>

  <rect x="364" y="526" width="160" height="72" rx="8" class="box alloc"/>
  <text x="444" y="548" text-anchor="middle" class="label">PageTable</text>
  <text x="444" y="572" text-anchor="middle" class="label">Caches</text>
  <text x="444" y="592" text-anchor="middle" class="small">ptlock + pgtable</text>
  <rect x="540" y="526" width="156" height="72" rx="8" class="box alloc"/>
  <text x="618" y="548" text-anchor="middle" class="label">Vmalloc</text>
  <text x="618" y="572" text-anchor="middle" class="label">Allocator</text>
  <text x="618" y="592" text-anchor="middle" class="small">vmap space</text>

  <rect x="364" y="632" width="160" height="72" rx="8" class="box debug"/>
  <text x="444" y="660" text-anchor="middle" class="label">MemoryDebug</text>
  <text x="444" y="684" text-anchor="middle" class="small">debug pagealloc</text>
  <rect x="540" y="632" width="156" height="72" rx="8" class="box debug"/>
  <text x="618" y="660" text-anchor="middle" class="label">StackDepot</text>
  <text x="618" y="684" text-anchor="middle" class="small">已启用配置</text>

  <rect x="364" y="738" width="160" height="72" rx="8" class="box memory"/>
  <text x="444" y="766" text-anchor="middle" class="label">MmCache</text>
  <text x="444" y="790" text-anchor="middle" class="small">mm_cache_init</text>
  <rect x="540" y="738" width="156" height="72" rx="8" class="box trimmed"/>
  <text x="618" y="766" text-anchor="middle" class="label">ExecMemory</text>
  <text x="618" y="790" text-anchor="middle" class="small">当前裁剪</text>

  <rect x="762" y="116" width="468" height="724" rx="14" class="group"/>
  <text x="996" y="150" text-anchor="middle" class="group-title">default_config 裁剪路径</text>
  <rect x="794" y="186" width="180" height="66" rx="8" class="box trimmed"/>
  <text x="884" y="212" text-anchor="middle" class="label">PageExt</text>
  <text x="884" y="234" text-anchor="middle" class="small">PAGE_EXTENSION=n</text>
  <rect x="1008" y="186" width="180" height="66" rx="8" class="box trimmed"/>
  <text x="1098" y="212" text-anchor="middle" class="label">KFence</text>
  <text x="1098" y="234" text-anchor="middle" class="small">KFENCE=n</text>

  <rect x="794" y="288" width="180" height="66" rx="8" class="box trimmed"/>
  <text x="884" y="314" text-anchor="middle" class="label">KMSAN</text>
  <text x="884" y="336" text-anchor="middle" class="small">KMSAN=n</text>
  <rect x="1008" y="288" width="180" height="66" rx="8" class="box trimmed"/>
  <text x="1098" y="314" text-anchor="middle" class="label">Kmemleak</text>
  <text x="1098" y="336" text-anchor="middle" class="small">DEBUG_KMEMLEAK=n</text>

  <rect x="794" y="390" width="180" height="66" rx="8" class="box trimmed"/>
  <text x="884" y="416" text-anchor="middle" class="label">DebugObjects</text>
  <text x="884" y="438" text-anchor="middle" class="small">DEBUG_OBJECTS=n</text>
  <rect x="1008" y="390" width="180" height="66" rx="8" class="box trimmed"/>
  <text x="1098" y="416" text-anchor="middle" class="label">KASAN</text>
  <text x="1098" y="438" text-anchor="middle" class="small">KASAN=n</text>

  <rect x="794" y="492" width="180" height="66" rx="8" class="box trimmed"/>
  <text x="884" y="518" text-anchor="middle" class="label">Modules</text>
  <text x="884" y="540" text-anchor="middle" class="small">MODULES=n</text>
  <rect x="1008" y="492" width="180" height="66" rx="8" class="box trimmed"/>
  <text x="1098" y="518" text-anchor="middle" class="label">Kprobes/BPF JIT</text>
  <text x="1098" y="540" text-anchor="middle" class="small">KPROBES=n, JIT=n</text>

  <rect x="794" y="604" width="394" height="52" rx="8" class="box trimmed"/>
  <text x="991" y="624" text-anchor="middle" class="small">裁剪路径仍保留调用位置说明；不作为当前主线 formal 结束状态</text>
  <text x="991" y="644" text-anchor="middle" class="tiny">ExecMemory 因 MODULES/BPF_JIT/KPROBES 均未启用，当前视为 no-op/不需要</text>

  <path d="M268 222 C300 222, 320 220, 354 220" class="edge"/>
  <path d="M530 382 C530 400, 530 404, 530 418" class="edge"/>
  <path d="M524 456 L538 456" class="edge"/>
  <path d="M618 492 C618 510, 618 512, 618 524" class="edge"/>
  <path d="M524 562 L538 562" class="edge"/>
  <path d="M444 598 L444 630" class="edge"/>
  <path d="M618 704 C618 720, 618 722, 618 736" class="edge"/>
</svg>

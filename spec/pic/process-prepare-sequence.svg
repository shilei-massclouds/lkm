<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="3440" viewBox="0 0 1280 3440" role="img" aria-labelledby="title desc">
  <title id="title">进程准备期对象构建时序</title>
  <desc id="desc">展示 Linux 6.12.37 default_config 下 start_kernel() 从 pid_idr_init() 到 kcsan_init() 的有效调用顺序。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 600; }
      .subtitle { font-size: 19px; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .stage { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .formal { fill: #ecfdf5; stroke: #10b981; }
      .proc { fill: #ecfdf5; stroke: #10b981; }
      .mm { fill: #fefce8; stroke: #ca8a04; }
      .fs { fill: #eff6ff; stroke: #3b82f6; }
      .sec { fill: #f5f3ff; stroke: #7c3aed; }
      .trimmed { fill: #fff7ed; stroke: #f97316; stroke-dasharray: 7 5; }
      .obj { font-size: 23px; font-weight: 600; dominant-baseline: middle; }
      .line1 { font-size: 21px; font-weight: 600; dominant-baseline: middle; }
      .line2 { font-size: 17px; fill: #475569; dominant-baseline: middle; }
      .boundary { font-size: 18px; font-weight: 600; fill: #334155; dominant-baseline: middle; }
      .num { font-size: 17px; font-weight: 600; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .timeline { stroke: #64748b; stroke-width: 2; stroke-linecap: round; }
      .dot { fill: #334155; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="3440" fill="#ffffff"/>
  <text x="640" y="46" text-anchor="middle" class="title">进程准备期对象构建时序</text>
  <text x="640" y="76" text-anchor="middle" class="subtitle">ProcessPreparePhase.setup(): pid_idr_init() 到 kcsan_init()，下一步进入 rest_init()</text>
  <rect x="48" y="126" width="214" height="3250" rx="14" class="lane"/>
  <text x="155" y="162" text-anchor="middle" class="obj">进程准备期</text>
  <text x="155" y="188" text-anchor="middle" class="obj">ProcessPreparePhase</text>
  <line x1="155" y1="224" x2="155" y2="3340" class="timeline"/>
  <rect x="292" y="116" width="876" height="52" rx="10" class="stage"/>
  <text x="320" y="142" class="boundary">起点：中断总入口已开放；尚未创建 PID 1 与 kthreadd</text>

  <g transform="translate(0 -48)">
  <g transform="translate(0 56)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">1</text><rect x="292" y="204" width="876" height="84" rx="10" class="box proc"/><text x="320" y="232" class="line1">RootPidNamespace.setup(): pid_idr_init()</text><text x="320" y="260" class="line2">配置 pid_max，初始化 init_pid_ns.idr，并创建 level-0 pid cache</text></g>
  <g transform="translate(0 156)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">2</text><rect x="292" y="204" width="876" height="84" rx="10" class="box mm"/><text x="320" y="232" class="line1">AnonVmaCore.setup(): anon_vma_init()</text><text x="320" y="260" class="line2">创建 anon_vma 与 anon_vma_chain cache，准备匿名内存 rmap graph</text></g>
  <g transform="translate(0 256)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">3</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">X86 EFI runtime switch: trimmed</text><text x="320" y="260" class="line2">当前 CONFIG_X86=n；RISC-V 不执行 efi_enter_virtual_mode()</text></g>
  <g transform="translate(0 356)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">4</text><rect x="292" y="204" width="876" height="84" rx="10" class="box proc"/><text x="320" y="232" class="line1">TaskCreationCore.preset(): thread_stack_cache_init()</text><text x="320" y="260" class="line2">当前 VMAP_STACK=y，创建 thread_stack cache 作为任务创建子资源</text></g>
  <g transform="translate(0 456)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">5</text><rect x="292" y="204" width="876" height="84" rx="10" class="box sec"/><text x="320" y="232" class="line1">CredentialCore.preset(): cred_init()</text><text x="320" y="260" class="line2">只创建 cred cache，推进到 Prepared，后续 setup 留余地</text></g>
  <g transform="translate(0 556)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">6</text><rect x="292" y="204" width="876" height="84" rx="10" class="box proc"/><text x="320" y="232" class="line1">TaskCreationCore.setup(): fork_init()</text><text x="320" y="260" class="line2">先创建 task_struct cache，随后驱动架构 task cache 初始化</text></g>
  <g transform="translate(0 656)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">7</text><rect x="292" y="204" width="876" height="84" rx="10" class="box proc"/><text x="320" y="232" class="line1">VectorContext.preset(): arch_task_cache_init()</text><text x="320" y="260" class="line2">RISC-V vector 可用时，创建 user/kernel vector context cache</text></g>
  <g transform="translate(0 756)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">8</text><rect x="292" y="204" width="876" height="84" rx="10" class="box proc"/><text x="320" y="232" class="line1">TaskCreationCore.setup(): fork_init() 后段</text><text x="320" y="260" class="line2">配置 max_threads、init_task rlimit、init_user_ns 上限与 vm stack hotplug</text></g>
  <g transform="translate(0 856)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">9</text><rect x="292" y="204" width="876" height="84" rx="10" class="box proc"/><text x="320" y="232" class="line1">UprobeCore.setup(): uprobes_init()</text><text x="320" y="260" class="line2">当前 UPROBES=y，初始化 hash mutex 并注册 die notifier</text></g>
  <g transform="translate(0 956)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">10</text><rect x="292" y="204" width="876" height="84" rx="10" class="box proc"/><text x="320" y="232" class="line1">ProcessResourceCaches.setup(): proc_caches_init()</text><text x="320" y="260" class="line2">创建 sighand/signal/files/fs/vma/vma_lock cache，并初始化 mmap/nsproxy</text></g>
  <g transform="translate(0 1056)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">11</text><rect x="292" y="204" width="876" height="84" rx="10" class="box proc"/><text x="320" y="232" class="line1">UtsNamespace.setup(): uts_ns_init()</text><text x="320" y="260" class="line2">当前 UTS_NS=y，创建 uts_namespace cache</text></g>
  <g transform="translate(0 1156)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">12</text><rect x="292" y="204" width="876" height="84" rx="10" class="box sec"/><text x="320" y="232" class="line1">KeyringCore.setup(): key_init()</text><text x="320" y="260" class="line2">创建 key_jar cache，登记内建 key type，并插入 root key user</text></g>
  <g transform="translate(0 1256)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">13</text><rect x="292" y="204" width="876" height="84" rx="10" class="box sec"/><text x="320" y="232" class="line1">SecurityCore.setup(): security_init()</text><text x="320" y="260" class="line2">当前 SECURITY=y，追加 early LSM 名称并按顺序初始化 LSM</text></g>
  <g transform="translate(0 1356)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">14</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">dbg_late_init(): trimmed/no-op</text><text x="320" y="260" class="line2">当前 CONFIG_KGDB=n，宏为空</text></g>
  <g transform="translate(0 1456)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">15</text><rect x="292" y="204" width="876" height="84" rx="10" class="box proc"/><text x="320" y="232" class="line1">NetNamespace.setup(): net_ns_init()</text><text x="320" y="260" class="line2">当前 NET_NS=y，初始化网络 namespace 基础</text></g>
  <g transform="translate(0 1556)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">16</text><rect x="292" y="204" width="876" height="84" rx="10" class="box fs"/><text x="320" y="232" class="line1">VfsCore.setup(): vfs_caches_init()</text><text x="320" y="260" class="line2">建立 VFS 运行期 cache 和全局结构</text></g>
  <g transform="translate(0 1656)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">17</text><rect x="292" y="204" width="876" height="84" rx="10" class="box mm"/><text x="320" y="232" class="line1">PageCache.setup(): pagecache_init()</text><text x="320" y="260" class="line2">初始化 page cache 基础结构</text></g>
  <g transform="translate(0 1756)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">18</text><rect x="292" y="204" width="876" height="84" rx="10" class="box proc"/><text x="320" y="232" class="line1">SignalCore.setup(): signals_init()</text><text x="320" y="260" class="line2">初始化信号核心路径；与 signal/sighand cache 关系后续细化</text></g>
  <g transform="translate(0 1856)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">19</text><rect x="292" y="204" width="876" height="84" rx="10" class="box fs"/><text x="320" y="232" class="line1">SeqFileCore.setup(): seq_file_init()</text><text x="320" y="260" class="line2">初始化 seq_file iterator/cache 基础</text></g>
  <g transform="translate(0 1956)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">20</text><rect x="292" y="204" width="876" height="84" rx="10" class="box fs"/><text x="320" y="232" class="line1">Procfs.setup(): proc_root_init()</text><text x="320" y="260" class="line2">当前 PROC_FS=y，建立 procfs 根和基础入口</text></g>
  <g transform="translate(0 2056)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">21</text><rect x="292" y="204" width="876" height="84" rx="10" class="box fs"/><text x="320" y="232" class="line1">Nsfs.setup(): nsfs_init()</text><text x="320" y="260" class="line2">初始化 namespace fd 对应的 pseudo fs</text></g>
  <g transform="translate(0 2156)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">22</text><rect x="292" y="204" width="876" height="84" rx="10" class="box fs"/><text x="320" y="232" class="line1">Pidfs.setup(): pidfs_init()</text><text x="320" y="260" class="line2">挂载 pidfs pseudo filesystem，为 pidfd 文件对象提供基础</text></g>
  <g transform="translate(0 2256)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">23</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">cpuset_init(): trimmed/no-op</text><text x="320" y="260" class="line2">当前 CONFIG_CGROUPS=n，cpuset 为空实现</text></g>
  <g transform="translate(0 2356)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">24</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">cgroup_init(): trimmed/no-op</text><text x="320" y="260" class="line2">当前 CONFIG_CGROUPS=n；未来恢复为 CgroupCore.setup()</text></g>
  <g transform="translate(0 2456)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">25</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">taskstats_init_early(): trimmed/no-op</text><text x="320" y="260" class="line2">当前 CONFIG_TASKSTATS=n，空实现</text></g>
  <g transform="translate(0 2556)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">26</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">delayacct_init(): trimmed/no-op</text><text x="320" y="260" class="line2">当前 TASK_DELAY_ACCT 未启用，空实现</text></g>
  <g transform="translate(0 2656)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">27</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">acpi_subsystem_init(): trimmed/no-op</text><text x="320" y="260" class="line2">当前 CONFIG_ACPI=n；未来作为 AcpiCore.setup() 后续完成步骤讨论</text></g>
  <g transform="translate(0 2756)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">28</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">arch_post_acpi_subsys_init(): trimmed/no-op</text><text x="320" y="260" class="line2">当前 RISC-V 使用 weak empty 实现</text></g>
  <g transform="translate(0 2856)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">29</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">kcsan_init(): trimmed/no-op</text><text x="320" y="260" class="line2">当前 CONFIG_KCSAN=n；下一步进入 rest_init()</text></g>
  </g>

  <rect x="292" y="3280" width="876" height="52" rx="10" class="stage"/>
  <text x="320" y="3306" class="boundary">终点：PID/fork/cred/namespace/fs 等基础已准备；rest_init() 将创建 kernel_init 与 kthreadd</text>
</svg>

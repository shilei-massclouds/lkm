<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">中断时间准备期对象分类与相互关系</title>
  <desc id="desc">展示 BootPhase 子阶段 6 在 Linux 6.12.37 default_config 下从 early_irq_init() 到 local_irq_enable() 前的对象边界。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 600; }
      .subtitle { font-size: 18px; fill: #475569; }
      .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .phase { fill: #eef2ff; stroke: #6366f1; }
      .ready { fill: #ecfdf5; stroke: #10b981; }
      .irq { fill: #f0fdfa; stroke: #14b8a6; }
      .time { fill: #fff7ed; stroke: #f97316; }
      .async { fill: #eff6ff; stroke: #3b82f6; }
      .deferred { fill: #f8fafc; stroke: #94a3b8; stroke-dasharray: 7 5; }
      .label { font-size: 20px; font-weight: 600; dominant-baseline: middle; }
      .small { font-size: 15px; fill: #475569; dominant-baseline: middle; }
      .group-title { font-size: 20px; font-weight: 600; fill: #334155; }
      .edge { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="820" fill="#ffffff"/>
  <text x="640" y="46" text-anchor="middle" class="title">中断时间准备期对象分类与相互关系</text>
  <text x="640" y="76" text-anchor="middle" class="subtitle">BootPhase 子阶段 6：early_irq_init() 到 local_irq_enable() 前</text>

  <rect x="50" y="116" width="235" height="644" rx="14" class="group"/>
  <text x="168" y="150" text-anchor="middle" class="group-title">阶段边界</text>
  <rect x="82" y="186" width="172" height="72" rx="8" class="box phase"/>
  <text x="168" y="214" text-anchor="middle" class="label">中断时间准备期</text>
  <text x="168" y="238" text-anchor="middle" class="small">IrqTimeInitPhase</text>
  <rect x="82" y="304" width="172" height="72" rx="8" class="box ready"/>
  <text x="168" y="332" text-anchor="middle" class="label">SchedInit</text>
  <text x="168" y="356" text-anchor="middle" class="small">Ready 输入</text>
  <rect x="82" y="422" width="172" height="72" rx="8" class="box phase"/>
  <text x="168" y="450" text-anchor="middle" class="label">IRQ Enable Gate</text>
  <text x="168" y="474" text-anchor="middle" class="small">local_irq_enable 前</text>
  <path d="M168 304 L168 264" class="edge"/>
  <path d="M168 422 L168 382" class="edge"/>

  <rect x="320" y="116" width="420" height="644" rx="14" class="group"/>
  <text x="530" y="150" text-anchor="middle" class="group-title">IRQ 与时间基础</text>
  <rect x="350" y="184" width="160" height="72" rx="8" class="box irq"/>
  <text x="430" y="212" text-anchor="middle" class="label">IrqDispatchTree</text>
  <text x="430" y="236" text-anchor="middle" class="small">domain tree + chip</text>
  <rect x="550" y="184" width="160" height="72" rx="8" class="box time"/>
  <text x="630" y="212" text-anchor="middle" class="label">Tick</text>
  <text x="630" y="236" text-anchor="middle" class="small">preset，setup 后补</text>
  <rect x="350" y="304" width="160" height="72" rx="8" class="box irq"/>
  <text x="430" y="332" text-anchor="middle" class="label">SbiIpi</text>
  <text x="430" y="356" text-anchor="middle" class="small">Ready，启用后置</text>
  <rect x="550" y="304" width="160" height="72" rx="8" class="box time"/>
  <text x="630" y="332" text-anchor="middle" class="label">TimerWheel</text>
  <text x="630" y="356" text-anchor="middle" class="small">CpuTimerBases[*]</text>
  <rect x="350" y="424" width="160" height="72" rx="8" class="box irq"/>
  <text x="430" y="452" text-anchor="middle" class="label">Softirq</text>
  <text x="430" y="476" text-anchor="middle" class="small">Prepared -> Ready</text>
  <rect x="550" y="424" width="160" height="72" rx="8" class="box time"/>
  <text x="630" y="452" text-anchor="middle" class="label">HrtimerCore</text>
  <text x="630" y="476" text-anchor="middle" class="small">cpu bases + softirq</text>
  <rect x="350" y="584" width="160" height="72" rx="8" class="box time"/>
  <text x="430" y="612" text-anchor="middle" class="label">RiscvTimerProvider</text>
  <text x="430" y="636" text-anchor="middle" class="small">setup, enable 后置</text>
  <rect x="550" y="584" width="160" height="72" rx="8" class="box time"/>
  <text x="630" y="612" text-anchor="middle" class="label">Timekeeper</text>
  <text x="630" y="636" text-anchor="middle" class="small">jiffies clocksource</text>

  <rect x="775" y="116" width="455" height="644" rx="14" class="group"/>
  <text x="1002" y="150" text-anchor="middle" class="group-title">出口准备</text>
  <rect x="805" y="184" width="176" height="72" rx="8" class="box deferred"/>
  <text x="893" y="212" text-anchor="middle" class="label">SRCU</text>
  <text x="893" y="236" text-anchor="middle" class="small">deferred</text>
  <rect x="1018" y="184" width="176" height="72" rx="8" class="box async"/>
  <text x="1106" y="212" text-anchor="middle" class="label">Randomness</text>
  <text x="1106" y="236" text-anchor="middle" class="small">after timekeeping</text>
  <rect x="805" y="310" width="176" height="72" rx="8" class="box async"/>
  <text x="893" y="338" text-anchor="middle" class="label">InitTask action</text>
  <text x="893" y="362" text-anchor="middle" class="small">refresh stack canary</text>
  <rect x="1018" y="310" width="176" height="72" rx="8" class="box deferred"/>
  <text x="1106" y="338" text-anchor="middle" class="label">Perf/Profile</text>
  <text x="1106" y="362" text-anchor="middle" class="small">perf deferred</text>
  <rect x="805" y="436" width="176" height="72" rx="8" class="box irq"/>
  <text x="893" y="464" text-anchor="middle" class="label">SmpCallFunction</text>
  <text x="893" y="488" text-anchor="middle" class="small">IPI foundation</text>
  <rect x="805" y="592" width="389" height="72" rx="8" class="box phase"/>
  <text x="999" y="620" text-anchor="middle" class="label">early_boot_irqs_disabled = false</text>
  <text x="999" y="644" text-anchor="middle" class="small">local_irq_enable() 进入下一阶段</text>

  <path d="M254 222 C286 222, 304 220, 348 220" class="edge"/>
  <path d="M510 220 L548 220" class="edge"/>
  <path d="M430 256 L430 302" class="edge"/>
  <path d="M630 256 L630 302" class="edge"/>
  <path d="M630 376 L630 422" class="edge"/>
  <path d="M430 376 L430 422" class="edge"/>
  <path d="M630 496 L630 582" class="edge"/>
  <path d="M630 656 C700 656, 742 220, 803 220" class="edge"/>
  <path d="M510 340 C635 340, 702 460, 803 472" class="edge"/>
  <path d="M981 220 L1016 220" class="edge"/>
  <path d="M1106 256 C1106 286, 1000 306, 981 346" class="edge"/>
  <path d="M981 346 L1016 346" class="edge"/>
  <path d="M893 508 C893 550, 934 570, 999 590" class="edge"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1720" viewBox="0 0 1280 1720" role="img" aria-labelledby="title desc">
  <title id="title">收尾期对象构建时序</title><desc id="desc">展示 FinalizePhase 中 kernel_init_freeable() 返回后的有效调用顺序。</desc>
  <defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",Arial,sans-serif;fill:#0f172a}.title{font-size:30px;font-weight:600}.subtitle{font-size:19px;fill:#475569}.lane{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:8 6}.box{fill:#fff;stroke:#334155;stroke-width:1.2}.stage{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}.formal{fill:#ecfdf5;stroke:#10b981}.mm{fill:#fefce8;stroke:#ca8a04}.sync{fill:#f5f3ff;stroke:#7c3aed}.support{fill:#eff6ff;stroke:#3b82f6}.deferred{fill:#eff6ff;stroke:#3b82f6;stroke-dasharray:7 5}.trimmed{fill:#fff7ed;stroke:#f97316;stroke-dasharray:7 5}.obj{font-size:23px;font-weight:600;dominant-baseline:middle}.line1{font-size:21px;font-weight:600;dominant-baseline:middle}.line2{font-size:17px;fill:#475569;dominant-baseline:middle}.boundary{font-size:18px;font-weight:600;fill:#334155;dominant-baseline:middle}.num{font-size:17px;font-weight:600;fill:#fff;text-anchor:middle;dominant-baseline:middle}.timeline{stroke:#64748b;stroke-width:2;stroke-linecap:round}.dot{fill:#334155}</style></defs>
  <rect width="1280" height="1720" fill="#fff"/><text x="640" y="46" text-anchor="middle" class="title">收尾期对象构建时序</text><text x="640" y="76" text-anchor="middle" class="subtitle">FinalizePhase.setup(): async_synchronize_full() 到 do_sysctl_args()</text><rect x="48" y="126" width="214" height="1520" rx="14" class="lane"/><text x="155" y="162" text-anchor="middle" class="obj">收尾期</text><text x="155" y="188" text-anchor="middle" class="obj">FinalizePhase</text><line x1="155" y1="224" x2="155" y2="1610" class="timeline"/><rect x="292" y="116" width="876" height="52" rx="10" class="stage"/><text x="320" y="142" class="boundary">起点：RootfsPhase 已 Ready；kernel_init_freeable() 已返回</text>
  <g transform="translate(0 -48)"><g transform="translate(0 56)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">1</text><rect x="292" y="204" width="876" height="84" rx="10" class="box deferred"/><text x="320" y="232" class="line1">AsyncCore.synchronize_full(): async_synchronize_full() deferred</text><text x="320" y="260" class="line2">保留释放 init memory 前等待 async init work 的时序位置</text></g><g transform="translate(0 166)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">2</text><rect x="292" y="204" width="876" height="84" rx="10" class="box sync"/><text x="320" y="232" class="line1">SystemState.enable(): value = SYSTEM_FREEING_INITMEM</text><text x="320" y="260" class="line2">进入释放 init memory 窗口；这是 enable 的中间属性值</text></g><g transform="translate(0 276)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">3</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">kprobe_free_init_mem() / kgdb_free_init_mem(): trimmed/no-op</text><text x="320" y="260" class="line2">当前 KPROBES=n 且 KGDB=n</text></g><g transform="translate(0 386)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">4</text><rect x="292" y="204" width="876" height="84" rx="10" class="box deferred"/><text x="320" y="232" class="line1">FtraceCore.free_init_mem(): ftrace_free_init_mem() deferred</text><text x="320" y="260" class="line2">当前 FTRACE=y，保留释放 init 区间 ftrace 记录的位置</text></g><g transform="translate(0 496)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">5</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">exit_boot_config(): trimmed/no-op</text><text x="320" y="260" class="line2">当前 BOOT_CONFIG=n</text></g><g transform="translate(0 606)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">6</text><rect x="292" y="204" width="876" height="84" rx="10" class="box deferred"/><text x="320" y="232" class="line1">InitMemory.free(): free_initmem() deferred</text><text x="320" y="260" class="line2">RISC-V 调用 free_initmem_default(POISON_FREE_INITMEM)，当前不展开</text></g><g transform="translate(0 716)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">7</text><rect x="292" y="204" width="876" height="84" rx="10" class="box deferred"/><text x="320" y="232" class="line1">KernelMappingProtection.enable(): mark_readonly() deferred</text><text x="320" y="260" class="line2">STRICT_KERNEL_RWX=y，保留 rodata readonly 与 W^X 检查位置</text></g><g transform="translate(0 826)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">8</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">pti_finalize(): trimmed/no-op</text><text x="320" y="260" class="line2">当前 RISC-V 为空 inline</text></g><g transform="translate(0 936)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">9</text><rect x="292" y="204" width="876" height="84" rx="10" class="box sync"/><text x="320" y="232" class="line1">SystemState.enable(): value = SYSTEM_RUNNING</text><text x="320" y="260" class="line2">SystemState 进入 Online；仍需 RCU 与 sysctl 收尾</text></g><g transform="translate(0 1046)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">10</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">numa_default_policy(): trimmed/no-op</text><text x="320" y="260" class="line2">当前 NUMA=n</text></g><g transform="translate(0 1156)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">11</text><rect x="292" y="204" width="876" height="84" rx="10" class="box support"/><text x="320" y="232" class="line1">RcuCore.end_inkernel_boot(): rcu_end_inkernel_boot()</text><text x="320" y="260" class="line2">取消 boot 偏置，必要时切 normal GP，并写入 rcu_boot_ended</text></g><g transform="translate(0 1266)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">12</text><rect x="292" y="204" width="876" height="84" rx="10" class="box deferred"/><text x="320" y="232" class="line1">SysctlArgs.apply(): do_sysctl_args() deferred</text><text x="320" y="260" class="line2">保留 sysctl.* 启动参数处理位置；随后进入 PayloadPhase</text></g></g><rect x="292" y="1560" width="876" height="52" rx="10" class="stage"/><text x="320" y="1586" class="boundary">终点：SystemState/RcuCore 收尾完成，其它保留位置；下一步 PayloadPhase</text>
</svg>

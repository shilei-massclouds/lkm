<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1700" viewBox="0 0 1280 1700" role="img" aria-labelledby="title desc">
  <title id="title">Scheduler Init Sequence</title>
  <desc id="desc">Shows Linux 6.12.37 default_config start_kernel() calls from after mm_core_init() to context_tracking_init().</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 600; }
      .subtitle { font-size: 19px; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .stage { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .formal { fill: #ecfdf5; stroke: #10b981; }
      .checkpoint { fill: #f5f3ff; stroke: #7c3aed; }
      .trimmed { fill: #f1f5f9; stroke: #64748b; stroke-dasharray: 6 4; }
      .obj { font-size: 23px; font-weight: 600; dominant-baseline: middle; }
      .line1 { font-size: 21px; font-weight: 600; dominant-baseline: middle; }
      .line2 { font-size: 17px; fill: #475569; dominant-baseline: middle; }
      .boundary { font-size: 18px; font-weight: 600; fill: #334155; dominant-baseline: middle; }
      .num { font-size: 17px; font-weight: 600; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .timeline { stroke: #64748b; stroke-width: 2; stroke-linecap: round; }
      .dot { fill: #334155; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="1700" fill="#ffffff"/>
  <text x="640" y="46" text-anchor="middle" class="title">Scheduler Init Sequence</text>
  <text x="640" y="76" text-anchor="middle" class="subtitle">SchedulerInitPhase.setup(): after mm_core_init() to context_tracking_init()</text>
  <rect x="48" y="126" width="214" height="1510" rx="14" class="lane"/>
  <text x="155" y="162" text-anchor="middle" class="obj">SchedulerInit</text>
  <text x="155" y="188" text-anchor="middle" class="obj">Phase</text>
  <line x1="155" y1="224" x2="155" y2="1598" class="timeline"/>
  <rect x="292" y="116" width="876" height="52" rx="10" class="stage"/>
  <text x="320" y="142" class="boundary">Start: mm_core_init() returned; core memory management is ready</text>

  <g transform="translate(0 -48)">
  <g transform="translate(0 56)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">1</text><rect x="292" y="204" width="876" height="84" rx="10" class="box trimmed"/><text x="320" y="232" class="line1">poking_init()</text><text x="320" y="260" class="line2">RISC-V64 no-op/checkpoint: text poking is deferred to patching support</text></g>
  <g transform="translate(0 156)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">2</text><rect x="292" y="204" width="876" height="84" rx="10" class="box formal"/><text x="320" y="232" class="line1">FunctionTracer.setup(): ftrace_init()</text><text x="320" y="260" class="line2">CONFIG_FTRACE=y; prepares call-site metadata and dynamic ftrace state</text></g>
  <g transform="translate(0 256)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">3</text><rect x="292" y="204" width="876" height="84" rx="10" class="box formal"/><text x="320" y="232" class="line1">EarlyTrace.setup(): early_trace_init()</text><text x="320" y="260" class="line2">Allocates trace buffers and prepares early trace event state</text></g>
  <g transform="translate(0 356)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">4</text><rect x="292" y="204" width="876" height="84" rx="10" class="box formal"/><text x="320" y="232" class="line1">Scheduler.setup(): sched_init()</text><text x="320" y="260" class="line2">Prepares boot CPU runqueue, idle task binding, and scheduler base</text></g>
  <g transform="translate(0 456)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">5</text><rect x="292" y="204" width="876" height="84" rx="10" class="box checkpoint"/><text x="320" y="232" class="line1">WARN(!irqs_disabled(), ...)</text><text x="320" y="260" class="line2">Checkpoint: interrupts must stay disabled before scheduler base is ready</text></g>
  <g transform="translate(0 556)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">6</text><rect x="292" y="204" width="876" height="84" rx="10" class="box formal"/><text x="320" y="232" class="line1">KernelCollections.setup(): radix_tree_init(); maple_tree_init()</text><text x="320" y="260" class="line2">Common index infrastructure; may split by consumers later</text></g>
  <g transform="translate(0 656)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">7</text><rect x="292" y="204" width="876" height="84" rx="10" class="box formal"/><text x="320" y="232" class="line1">Housekeeping.setup(): housekeeping_init()</text><text x="320" y="260" class="line2">Builds housekeeping CPU masks for workqueue, tick/nohz, and isolation policy</text></g>
  <g transform="translate(0 756)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">8</text><rect x="292" y="204" width="876" height="84" rx="10" class="box formal"/><text x="320" y="232" class="line1">WorkqueueEarly.setup(): workqueue_init_early()</text><text x="320" y="260" class="line2">Allows workqueue creation, queueing, and cancel; worker kthreads are deferred</text></g>
  <g transform="translate(0 856)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">9</text><rect x="292" y="204" width="876" height="84" rx="10" class="box formal"/><text x="320" y="232" class="line1">Rcu.setup(): rcu_init()</text><text x="320" y="260" class="line2">TREE_RCU: builds RCU tree, boot CPU online state, softirq, and workqueues</text></g>
  <g transform="translate(0 956)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">10</text><rect x="292" y="204" width="876" height="84" rx="10" class="box formal"/><text x="320" y="232" class="line1">TraceEvents.setup(): trace_init()</text><text x="320" y="260" class="line2">Trace events are usable after this; boot trace instances may be enabled</text></g>
  <g transform="translate(0 1056)"><circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">11</text><rect x="292" y="204" width="876" height="84" rx="10" class="box checkpoint"/><text x="320" y="232" class="line1">initcall_debug_enable(); context_tracking_init()</text><text x="320" y="260" class="line2">Checkpoint/no-op: CONTEXT_TRACKING_USER_FORCE is off; subphase ends</text></g>
  </g>

  <rect x="292" y="1540" width="876" height="52" rx="10" class="stage"/>
  <text x="320" y="1566" class="boundary">End: scheduler, early workqueue, RCU, and trace events ready; next is early_irq_init()</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">initcall 期对象分类与相互关系</title><desc id="desc">展示 SMP Runtime Phase 子阶段 3 do_basic_setup() 的对象边界。</desc>
  <defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",Arial,sans-serif;fill:#0f172a}.title{font-size:30px;font-weight:600}.subtitle{font-size:18px;fill:#475569}.group{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:8 6}.box{fill:#fff;stroke:#334155;stroke-width:1.2}.phase{fill:#eef2ff;stroke:#6366f1}.ready,.core{fill:#ecfdf5;stroke:#10b981}.support{fill:#eff6ff;stroke:#3b82f6}.table{fill:#f5f3ff;stroke:#7c3aed}.trimmed{fill:#fff7ed;stroke:#f97316;stroke-dasharray:7 5}.deferred{fill:#fefce8;stroke:#ca8a04;stroke-dasharray:7 5}.label{font-size:19px;font-weight:600;dominant-baseline:middle}.small{font-size:14px;fill:#475569;dominant-baseline:middle}.group-title{font-size:20px;font-weight:600;fill:#334155}.edge{stroke:#64748b;stroke-width:1.5;fill:none;marker-end:url(#arrow)}.edge-dash{stroke:#94a3b8;stroke-width:1.4;fill:none;stroke-dasharray:7 5;marker-end:url(#arrow2)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs>

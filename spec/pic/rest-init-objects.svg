<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
  <title id="title">rest_init 期对象分类与相互关系</title>
  <desc id="desc">展示 UP Multitask Phase 子阶段 1 在 Linux 6.12.37 default_config 下 rest_init() 的对象边界。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 600; }
      .subtitle { font-size: 18px; fill: #475569; }
      .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .phase { fill: #eef2ff; stroke: #6366f1; }
      .ready { fill: #ecfdf5; stroke: #10b981; }
      .flow { fill: #ecfdf5; stroke: #10b981; }
      .sched { fill: #f0fdfa; stroke: #14b8a6; }
      .sync { fill: #f5f3ff; stroke: #7c3aed; }
      .support { fill: #eff6ff; stroke: #3b82f6; }
      .trimmed { fill: #fff7ed; stroke: #f97316; stroke-dasharray: 7 5; }
      .label { font-size: 19px; font-weight: 600; dominant-baseline: middle; }
      .small { font-size: 14px; fill: #475569; dominant-baseline: middle; }
      .group-title { font-size: 20px; font-weight: 600; fill: #334155; }
      .edge { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .edge-dash { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow2); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="940" fill="#ffffff"/>
  <text x="640" y="46" text-anchor="middle" class="title">rest_init 期对象分类与相互关系</text>
  <text x="640" y="76" text-anchor="middle" class="subtitle">UP Multitask Phase 子阶段 1：rest_init() 创建 PID 1、kthreadd，并把启动根流转入 boot idle</text>

  <rect x="44" y="116" width="250" height="760" rx="14" class="group"/>
  <text x="169" y="150" text-anchor="middle" class="group-title">阶段边界</text>
  <rect x="75" y="184" width="188" height="72" rx="8" class="box ready"/>
  <text x="169" y="212" text-anchor="middle" class="label">ProcessPrepare</text>
  <text x="169" y="236" text-anchor="middle" class="small">Ready 输入</text>
  <rect x="75" y="304" width="188" height="82" rx="8" class="box phase"/>
  <text x="169" y="332" text-anchor="middle" class="label">rest_init 期</text>
  <text x="169" y="356" text-anchor="middle" class="small">RestInitPhase</text>
  <rect x="75" y="436" width="188" height="82" rx="8" class="box sched"/>
  <text x="169" y="464" text-anchor="middle" class="label">SYSTEM</text>
  <text x="169" y="488" text-anchor="middle" class="small">SCHEDULING</text>
  <rect x="75" y="568" width="188" height="82" rx="8" class="box flow"/>
  <text x="169" y="596" text-anchor="middle" class="label">单核多任务</text>
  <text x="169" y="620" text-anchor="middle" class="small">三条常规流存在</text>
  <rect x="75" y="700" width="188" height="82" rx="8" class="box phase"/>
  <text x="169" y="728" text-anchor="middle" class="label">PreSmpInit</text>
  <text x="169" y="752" text-anchor="middle" class="small">KernelInitFlow 继续</text>
  <path d="M169 256 L169 302" class="edge"/>
  <path d="M169 386 L169 434" class="edge"/>
  <path d="M169 518 L169 566" class="edge"/>
  <path d="M169 650 L169 698" class="edge"/>

  <rect x="330" y="116" width="515" height="760" rx="14" class="group"/>
  <text x="587" y="150" text-anchor="middle" class="group-title">新建与转换的常规流</text>
  <rect x="365" y="184" width="190" height="86" rx="8" class="box flow"/>
  <text x="460" y="214" text-anchor="middle" class="label">KernelInitFlow</text>
  <text x="460" y="238" text-anchor="middle" class="small">PID 1 / kernel_init</text>
  <rect x="590" y="184" width="190" height="86" rx="8" class="box support"/>
  <text x="685" y="214" text-anchor="middle" class="label">InitTask 属性</text>
  <text x="685" y="238" text-anchor="middle" class="small">boot CPU affinity</text>

  <rect x="365" y="328" width="190" height="86" rx="8" class="box flow"/>
  <text x="460" y="358" text-anchor="middle" class="label">KthreaddFlow</text>
  <text x="460" y="382" text-anchor="middle" class="small">kernel_thread(kthreadd)</text>
  <rect x="590" y="328" width="190" height="86" rx="8" class="box support"/>
  <text x="685" y="358" text-anchor="middle" class="label">kthreadd_task</text>
  <text x="685" y="382" text-anchor="middle" class="small">全局 task 引用</text>

  <rect x="365" y="472" width="190" height="86" rx="8" class="box flow"/>
  <text x="460" y="502" text-anchor="middle" class="label">StartupRootFlow</text>
  <text x="460" y="526" text-anchor="middle" class="small">上一阶段遗留流</text>
  <rect x="590" y="472" width="190" height="86" rx="8" class="box flow"/>
  <text x="685" y="502" text-anchor="middle" class="label">IdleFlow</text>
  <text x="685" y="526" text-anchor="middle" class="small">boot CPU idle</text>

  <rect x="365" y="616" width="190" height="86" rx="8" class="box sched"/>
  <text x="460" y="646" text-anchor="middle" class="label">BootCPU</text>
  <text x="460" y="670" text-anchor="middle" class="small">CPUHP_ONLINE</text>
  <rect x="590" y="616" width="190" height="86" rx="8" class="box support"/>
  <text x="685" y="646" text-anchor="middle" class="label">RootPidNs</text>
  <text x="685" y="670" text-anchor="middle" class="small">PID 查找/绑定</text>

  <path d="M555 227 L588 227" class="edge"/>
  <path d="M555 371 L588 371" class="edge"/>
  <path d="M555 515 L588 515" class="edge"/>
  <path d="M460 558 L460 614" class="edge"/>
  <path d="M685 616 L685 414" class="edge-dash"/>

  <rect x="880" y="116" width="350" height="760" rx="14" class="group"/>
  <text x="1055" y="150" text-anchor="middle" class="group-title">支撑对象与同步属性</text>
  <rect x="912" y="184" width="286" height="72" rx="8" class="box sched"/>
  <text x="1055" y="212" text-anchor="middle" class="label">RcuCore.start_scheduler</text>
  <text x="1055" y="236" text-anchor="middle" class="small">rcu_scheduler_starting()</text>
  <rect x="912" y="304" width="286" height="72" rx="8" class="box sync"/>
  <text x="1055" y="332" text-anchor="middle" class="label">KthreaddReadyGate</text>
  <text x="1055" y="356" text-anchor="middle" class="small">completion kthreadd_done</text>
  <rect x="912" y="424" width="286" height="72" rx="8" class="box sync"/>
  <text x="1055" y="452" text-anchor="middle" class="label">SystemState</text>
  <text x="1055" y="476" text-anchor="middle" class="small">SYSTEM_SCHEDULING</text>
  <rect x="912" y="544" width="286" height="72" rx="8" class="box trimmed"/>
  <text x="1055" y="572" text-anchor="middle" class="label">NumaDefaultPolicy</text>
  <text x="1055" y="596" text-anchor="middle" class="small">CONFIG_NUMA=n no-op</text>
  <rect x="912" y="664" width="286" height="72" rx="8" class="box support"/>
  <text x="1055" y="692" text-anchor="middle" class="label">Scheduler</text>
  <text x="1055" y="716" text-anchor="middle" class="small">schedule_preempt_disabled()</text>

  <path d="M263 345 C300 345, 310 227, 363 227" class="edge"/>
  <path d="M263 345 C300 345, 310 371, 363 371" class="edge"/>
  <path d="M263 345 C304 345, 312 515, 363 515" class="edge"/>
  <path d="M780 227 C840 227, 848 340, 910 340" class="edge"/>
  <path d="M780 371 C842 371, 846 340, 910 340" class="edge"/>
  <path d="M1055 376 L1055 422" class="edge"/>
  <path d="M912 460 C840 460, 830 515, 782 515" class="edge"/>
  <path d="M912 700 C850 700, 840 515, 782 515" class="edge"/>
  <path d="M912 220 C846 220, 840 228, 782 228" class="edge-dash"/>
  <path d="M912 580 C850 580, 835 371, 782 371" class="edge-dash"/>
</svg>

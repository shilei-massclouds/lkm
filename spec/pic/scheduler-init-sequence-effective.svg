<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="3208" viewBox="0 0 1280 3208" role="img" aria-labelledby="title desc">
  <title id="title">调度准备期对象构建时序</title>
  <desc id="desc">展示 Linux 6.12.37 default_config 下 start_kernel() 从 mm_core_init() 之后到 context_tracking_init() 调用点的子阶段 5 有效调用顺序，并展开 sched_init()。</desc>
  <defs>
    <style>
      text {
        font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", Arial, sans-serif;
        fill: #0f172a;
      }
      .title { font-size: 30px; font-weight: 600; }
      .subtitle { font-size: 19px; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .stage { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .formal { fill: #ecfdf5; stroke: #10b981; }
      .checkpoint { fill: #f5f3ff; stroke: #7c3aed; }
      .deferred { fill: #f1f5f9; stroke: #64748b; stroke-dasharray: 6 4; }
      .omitted { fill: #fff7ed; stroke: #f97316; stroke-dasharray: 5 4; }
      .obj { font-size: 23px; font-weight: 600; dominant-baseline: middle; }
      .line1 { font-size: 21px; font-weight: 600; dominant-baseline: middle; }
      .line2 { font-size: 17px; fill: #475569; dominant-baseline: middle; }
      .boundary { font-size: 18px; font-weight: 600; fill: #334155; dominant-baseline: middle; }
      .num { font-size: 17px; font-weight: 600; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .timeline { stroke: #64748b; stroke-width: 2; stroke-linecap: round; }
      .dot { fill: #334155; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="3208" fill="#ffffff"/>
  <text x="640" y="46" text-anchor="middle" class="title">调度准备期对象构建时序</text>
  <text x="640" y="76" text-anchor="middle" class="subtitle">SchedInitPhase.setup(): Linux 6.12.37 default_config 下 mm_core_init() 后到 context_tracking_init()</text>

  <rect x="48" y="126" width="214" height="3048" rx="14" class="lane"/>
  <text x="155" y="162" text-anchor="middle" class="obj">调度准备期</text>
  <text x="155" y="188" text-anchor="middle" class="subtitle">setup()</text>
  <line x1="155" y1="224" x2="155" y2="3126" class="timeline"/>

  <rect x="292" y="116" width="876" height="52" rx="10" class="stage"/>
  <text x="320" y="142" class="boundary">起点：MmCoreInitPhase.Ready，核心内存管理就绪，中断仍保持关闭</text>

  <g transform="translate(0 -56)">
  <g transform="translate(0 68)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">1</text>
    <rect x="292" y="204" width="876" height="88" rx="10" class="box omitted"/>
    <text x="320" y="234" class="line1">poking_init(); ftrace_init()</text>
    <text x="320" y="264" class="line2">trimmed/no-op：RISC-V poking weak hook；当前 CONFIG_FTRACE_MCOUNT_RECORD=n</text>
  </g>

  <g transform="translate(0 188)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">2</text>
    <rect x="292" y="204" width="876" height="88" rx="10" class="box deferred"/>
    <text x="320" y="234" class="line1">early_trace_init()</text>
    <text x="320" y="264" class="line2">deferred：LinuxTracing.preset 与项目 checkpoint trace 的关系尚未确定</text>
  </g>

  <g transform="translate(0 308)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">3</text>
    <rect x="292" y="190" width="876" height="116" rx="10" class="box formal"/>
    <text x="320" y="226" class="line1">Scheduler.preset(): sched_init 全局前置准备</text>
    <text x="320" y="256" class="line2">在逐 CPU RunQueue 建立前准备调度器全局依赖</text>
    <text x="320" y="282" class="line2">预留驱动 SchedClass.preset()，并建立 BitWaitQueueTable 和 DefaultSchedRootDomain</text>
  </g>

  <g transform="translate(0 456)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">3a</text>
    <rect x="292" y="190" width="876" height="116" rx="10" class="box deferred"/>
    <text x="320" y="226" class="line1">SchedClass.preset(): 调度类对象壳</text>
    <text x="320" y="256" class="line2">deferred：Stop、Deadline、Realtime、Fair、Idle sched class 先形成可引用对象壳</text>
    <text x="320" y="282" class="line2">顺序关系暂不单独建 checkpoint，除非后续确认为模型边界</text>
  </g>

  <g transform="translate(0 604)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">3b</text>
    <rect x="292" y="204" width="876" height="88" rx="10" class="box formal"/>
    <text x="320" y="234" class="line1">BitWaitQueueTable.preset()</text>
    <text x="320" y="264" class="line2">预置 wait_on_bit 和 wake_up_bit 使用的全局 waitqueue bucket 表</text>
  </g>

  <g transform="translate(0 724)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">3c</text>
    <rect x="292" y="190" width="876" height="116" rx="10" class="box formal"/>
    <text x="320" y="226" class="line1">DefaultSchedRootDomain.setup()</text>
    <text x="320" y="256" class="line2">在完整拓扑建立前，为 CPU 构建默认共享调度状态区域</text>
    <text x="320" y="282" class="line2">checkpoint：已可供 Cpu[id].RunQueue.attach_root() 使用</text>
  </g>

  <g transform="translate(0 872)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">4</text>
    <rect x="292" y="176" width="876" height="144" rx="10" class="box formal"/>
    <text x="320" y="214" class="line1">Scheduler.setup(): 逐 CPU 调度状态</text>
    <text x="320" y="244" class="line2">对每个 possible Cpu：驱动 Cpu[id].RunQueue.setup(DefaultSchedRootDomain)</text>
    <text x="320" y="270" class="line2">RunQueue 持有 CfsRunQueue、RealtimeRunQueue 和 DeadlineRunQueue 子对象</text>
    <text x="320" y="296" class="line2">其它 runqueue 字段先作为属性处理；FairServer 暂为 deferred</text>
  </g>

  <g transform="translate(0 1048)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">4a</text>
    <rect x="292" y="176" width="876" height="144" rx="10" class="box formal"/>
    <text x="320" y="214" class="line1">BootCPU.RunQueue.BootIdleTask.setup(source = InitTask/current)</text>
    <text x="320" y="244" class="line2">将已有 InitTask/current 推进为 boot CPU idle task 角色</text>
    <text x="320" y="270" class="line2">覆盖 load weight、time slice、InitMM lazy TLB 和 kthread 元数据</text>
    <text x="320" y="296" class="line2">checkpoint：RunQueue.idle == BootIdleTask 且 RunQueue.curr == BootIdleTask</text>
  </g>

  <g transform="translate(0 1224)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">4b</text>
    <rect x="292" y="190" width="876" height="116" rx="10" class="box formal"/>
    <text x="320" y="226" class="line1">Scheduler.setup(): 收尾属性</text>
    <text x="320" y="256" class="line2">设置全局 load 更新期限、BootCPU idle_thread_ref 和 balance_push_enabled</text>
    <text x="320" y="282" class="line2">这些仍是 Scheduler、BootCPU 和 RunQueue 属性，暂不拆成独立对象</text>
  </g>

  <g transform="translate(0 1372)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">4c</text>
    <rect x="292" y="176" width="876" height="144" rx="10" class="box deferred"/>
    <text x="320" y="214" class="line1">SchedClass.setup(): init_sched_fair_class() 等</text>
    <text x="320" y="244" class="line2">deferred：由 Scheduler.setup() 驱动各 sched class 对象从壳进入正式对象</text>
    <text x="320" y="270" class="line2">后续工作：fair balance masks、SCHED_SOFTIRQ handler 和 NOHZ balance state</text>
    <text x="320" y="296" class="line2">同时 deferred 或被配置省略：ExtSchedClass、PSI、Uclamp、PreemptDynamic</text>
  </g>

  <g transform="translate(0 1548)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">5</text>
    <rect x="292" y="204" width="876" height="88" rx="10" class="box formal"/>
    <text x="320" y="234" class="line1">Scheduler.enable()</text>
    <text x="320" y="264" class="line2">设置 scheduler_running = true；调度器进入启动期 online 状态</text>
  </g>

  <g transform="translate(0 1668)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">6</text>
    <rect x="292" y="204" width="876" height="88" rx="10" class="box checkpoint"/>
    <text x="320" y="234" class="line1">WARN(!irqs_disabled(), ...)</text>
    <text x="320" y="264" class="line2">checkpoint：sched_init 之后中断必须仍保持关闭</text>
  </g>

  <g transform="translate(0 1788)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">7</text>
    <rect x="292" y="204" width="876" height="88" rx="10" class="box formal"/>
    <text x="320" y="234" class="line1">RadixTree.setup(): radix_tree_init()</text>
    <text x="320" y="264" class="line2">创建 radix_tree_node SLUB cache，并登记 radix tree CPU hotplug dead 回调</text>
  </g>

  <g transform="translate(0 1908)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">8</text>
    <rect x="292" y="204" width="876" height="88" rx="10" class="box formal"/>
    <text x="320" y="234" class="line1">MapleTree.setup(): maple_tree_init()</text>
    <text x="320" y="264" class="line2">创建 maple_node SLUB cache；后续 VMA tree 等使用者另行建模</text>
  </g>

  <g transform="translate(0 2028)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">9</text>
    <rect x="292" y="190" width="876" height="116" rx="10" class="box deferred"/>
    <text x="320" y="226" class="line1">Housekeeping: housekeeping_init()</text>
    <text x="320" y="256" class="line2">deferred/no-op：管理 routine work 可运行 CPU 集合，服务 WQ/timer/kthread/RCU/tick</text>
    <text x="320" y="282" class="line2">当前未建模 nohz_full/isolcpus 参数，housekeeping.flags == 0 时直接返回</text>
  </g>

  <g transform="translate(0 2148)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">10</text>
    <rect x="292" y="190" width="876" height="116" rx="10" class="box formal"/>
    <text x="320" y="226" class="line1">Workqueue.preset(): workqueue_init_early()</text>
    <text x="320" y="256" class="line2">建立 system workqueue、worker pool、unbound cpumask 和 BH worker pool</text>
    <text x="320" y="282" class="line2">早期代码可创建 workqueue 并排队/取消 work item；worker 尚不执行</text>
  </g>

  <g transform="translate(0 2296)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">11</text>
    <rect x="292" y="190" width="876" height="116" rx="10" class="box formal"/>
    <text x="320" y="226" class="line1">SchedInitPhase drives Softirq.preset()</text>
    <text x="320" y="256" class="line2">建立 SoftirqActionTable、slots 和 per-CPU pending bit 承载壳</text>
    <text x="320" y="282" class="line2">进入 Prepared，使 rcu_init() 可注册 RCU_SOFTIRQ</text>
  </g>

  <g transform="translate(0 2444)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">12</text>
    <rect x="292" y="190" width="876" height="116" rx="10" class="box formal"/>
    <text x="320" y="226" class="line1">RcuCore.setup(): rcu_init()</text>
    <text x="320" y="256" class="line2">建立 RCU 树、boot CPU online、RCU softirq、workqueues 和 Tasks RCU facts</text>
    <text x="320" y="282" class="line2">依赖 scheduler/workqueue early 基础和 SoftirqActionTable.Prepared</text>
  </g>

  <g transform="translate(0 2592)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">13</text>
    <rect x="292" y="204" width="876" height="88" rx="10" class="box deferred"/>
    <text x="320" y="234" class="line1">trace_init()</text>
    <text x="320" y="264" class="line2">deferred：Linux event tracing 与项目 checkpoint trace 的边界未定</text>
  </g>

  <g transform="translate(0 2712)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">14</text>
    <rect x="292" y="204" width="876" height="88" rx="10" class="box checkpoint"/>
    <text x="320" y="234" class="line1">initcall_debug_enable()</text>
    <text x="320" y="264" class="line2">checkpoint/deferred：仅在 initcall_debug 参数开启时影响后续 initcall 诊断</text>
  </g>

  <g transform="translate(0 2832)">
    <circle cx="155" cy="248" r="15" class="dot"/><text x="155" y="248" class="num">15</text>
    <rect x="292" y="204" width="876" height="88" rx="10" class="box omitted"/>
    <text x="320" y="234" class="line1">context_tracking_init()</text>
    <text x="320" y="264" class="line2">trimmed/no-op：当前 CONFIG_CONTEXT_TRACKING_USER_FORCE=n，调用折叠为空实现</text>
  </g>
  </g>

  <rect x="292" y="3108" width="876" height="52" rx="10" class="stage"/>
  <text x="320" y="3134" class="boundary">终点：context_tracking_init() 调用点完成；调度、radix/maple、workqueue、softirq 与 RCU 支撑设施就绪</text>
</svg>

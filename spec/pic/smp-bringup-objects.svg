<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc">
  <title id="title">SMP 启动期对象分类与相互关系</title>
  <desc id="desc">展示 SMP Runtime Phase 子阶段 1 在 Linux 6.12.37 default_config 下 smp_init() 的对象边界。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 600; }
      .subtitle { font-size: 18px; fill: #475569; }
      .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
      .phase { fill: #eef2ff; stroke: #6366f1; }
      .ready { fill: #ecfdf5; stroke: #10b981; }
      .flow { fill: #ecfdf5; stroke: #10b981; }
      .cpu { fill: #f0fdfa; stroke: #14b8a6; }
      .sync { fill: #f5f3ff; stroke: #7c3aed; }
      .support { fill: #eff6ff; stroke: #3b82f6; }
      .trimmed { fill: #fff7ed; stroke: #f97316; stroke-dasharray: 7 5; }
      .label { font-size: 19px; font-weight: 600; dominant-baseline: middle; }
      .small { font-size: 14px; fill: #475569; dominant-baseline: middle; }
      .group-title { font-size: 20px; font-weight: 600; fill: #334155; }
      .edge { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .edge-dash { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow2); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="980" fill="#ffffff"/>
  <text x="640" y="46" text-anchor="middle" class="title">SMP 启动期对象分类与相互关系</text>
  <text x="640" y="76" text-anchor="middle" class="subtitle">SMP Runtime Phase 子阶段 1：smp_init() 启动 secondary CPU，打开真正多核并行</text>

  <rect x="44" y="116" width="250" height="804" rx="14" class="group"/>
  <text x="169" y="150" text-anchor="middle" class="group-title">阶段边界</text>
  <rect x="75" y="184" width="188" height="72" rx="8" class="box ready"/>
  <text x="169" y="212" text-anchor="middle" class="label">PreSmpInit</text>
  <text x="169" y="236" text-anchor="middle" class="small">Ready 输入</text>
  <rect x="75" y="304" width="188" height="82" rx="8" class="box phase"/>
  <text x="169" y="332" text-anchor="middle" class="label">SMP 启动期</text>
  <text x="169" y="356" text-anchor="middle" class="small">SmpBringupPhase</text>
  <rect x="75" y="436" width="188" height="82" rx="8" class="box cpu"/>
  <text x="169" y="464" text-anchor="middle" class="label">多核并行</text>
  <text x="169" y="488" text-anchor="middle" class="small">secondary online</text>
  <rect x="75" y="568" width="188" height="82" rx="8" class="box flow"/>
  <text x="169" y="596" text-anchor="middle" class="label">AP idle</text>
  <text x="169" y="620" text-anchor="middle" class="small">CPUHP_AP_ONLINE_IDLE</text>
  <rect x="75" y="700" width="188" height="82" rx="8" class="box phase"/>
  <text x="169" y="728" text-anchor="middle" class="label">RuntimeCore</text>
  <text x="169" y="752" text-anchor="middle" class="small">sched_init_smp()</text>
  <path d="M169 256 L169 302" class="edge"/>
  <path d="M169 386 L169 434" class="edge"/>
  <path d="M169 518 L169 566" class="edge"/>
  <path d="M169 650 L169 698" class="edge"/>

  <rect x="330" y="116" width="515" height="804" rx="14" class="group"/>
  <text x="587" y="150" text-anchor="middle" class="group-title">CPU bringup 主线</text>
  <rect x="365" y="184" width="190" height="82" rx="8" class="box flow"/>
  <text x="460" y="212" text-anchor="middle" class="label">KernelInitTask</text>
  <text x="460" y="236" text-anchor="middle" class="small">boot CPU driver</text>
  <rect x="590" y="184" width="190" height="82" rx="8" class="box cpu"/>
  <text x="685" y="212" text-anchor="middle" class="label">SmpBootPlan</text>
  <text x="685" y="236" text-anchor="middle" class="small">Prepared</text>

  <rect x="360" y="318" width="200" height="82" rx="8" class="box flow"/>
  <text x="460" y="346" text-anchor="middle" class="label">SecondaryIdle</text>
  <text x="460" y="370" text-anchor="middle" class="small">idle task/flow set</text>
  <rect x="580" y="318" width="210" height="82" rx="8" class="box sync"/>
  <text x="685" y="346" text-anchor="middle" class="label">CpuHotplugThreads</text>
  <text x="685" y="370" text-anchor="middle" class="small">per-CPU hp thread</text>

  <rect x="360" y="452" width="200" height="82" rx="8" class="box cpu"/>
  <text x="460" y="480" text-anchor="middle" class="label">CpuGroup</text>
  <text x="460" y="504" text-anchor="middle" class="small">enable secondary</text>
  <rect x="580" y="452" width="210" height="82" rx="8" class="box cpu"/>
  <text x="685" y="480" text-anchor="middle" class="label">SecondaryCPUs</text>
  <text x="685" y="504" text-anchor="middle" class="small">present -> online</text>

  <rect x="360" y="586" width="200" height="82" rx="8" class="box support"/>
  <text x="460" y="614" text-anchor="middle" class="label">CpuHotplugState</text>
  <text x="460" y="638" text-anchor="middle" class="small">CPUHP_ONLINE</text>
  <rect x="580" y="586" width="210" height="82" rx="8" class="box flow"/>
  <text x="685" y="614" text-anchor="middle" class="label">SecondaryEntry</text>
  <text x="685" y="638" text-anchor="middle" class="small">__cpu_up + smp_callin</text>

  <rect x="360" y="720" width="200" height="82" rx="8" class="box cpu"/>
  <text x="460" y="748" text-anchor="middle" class="label">BootCPU</text>
  <text x="460" y="772" text-anchor="middle" class="small">stays online</text>
  <rect x="580" y="720" width="210" height="82" rx="8" class="box flow"/>
  <text x="685" y="748" text-anchor="middle" class="label">AP IdleFlows</text>
  <text x="685" y="772" text-anchor="middle" class="small">local irq enabled</text>

  <path d="M263 345 C302 345, 315 225, 363 225" class="edge"/>
  <path d="M555 225 L588 225" class="edge"/>
  <path d="M460 266 L460 316" class="edge"/>
  <path d="M685 266 L685 316" class="edge"/>
  <path d="M555 359 C580 359, 585 480, 588 480" class="edge"/>
  <path d="M555 480 L588 480" class="edge"/>
  <path d="M685 534 L685 584" class="edge"/>
  <path d="M590 627 C540 627, 535 627, 557 627" class="edge-dash"/>
  <path d="M685 668 L685 718" class="edge"/>

  <rect x="880" y="116" width="350" height="804" rx="14" class="group"/>
  <text x="1055" y="150" text-anchor="middle" class="group-title">RISC-V entry 与裁剪路径</text>
  <rect x="912" y="184" width="286" height="72" rx="8" class="box support"/>
  <text x="1055" y="212" text-anchor="middle" class="label">PerCpuStorage</text>
  <text x="1055" y="236" text-anchor="middle" class="small">per-CPU runtime base</text>
  <rect x="912" y="304" width="286" height="72" rx="8" class="box sync"/>
  <text x="1055" y="332" text-anchor="middle" class="label">CpuRunningGate</text>
  <text x="1055" y="356" text-anchor="middle" class="small">completion handshake</text>
  <rect x="912" y="424" width="286" height="72" rx="8" class="box support"/>
  <text x="1055" y="452" text-anchor="middle" class="label">SbiIpi.enable(cpu)</text>
  <text x="1055" y="476" text-anchor="middle" class="small">riscv_ipi_enable()</text>
  <rect x="912" y="544" width="286" height="72" rx="8" class="box support"/>
  <text x="1055" y="572" text-anchor="middle" class="label">UserIsaExposure</text>
  <text x="1055" y="596" text-anchor="middle" class="small">riscv_user_isa_enable()</text>
  <rect x="912" y="664" width="286" height="72" rx="8" class="box trimmed"/>
  <text x="1055" y="692" text-anchor="middle" class="label">ParallelBringup</text>
  <text x="1055" y="716" text-anchor="middle" class="small">HOTPLUG_PARALLEL off</text>
  <rect x="912" y="784" width="286" height="72" rx="8" class="box trimmed"/>
  <text x="1055" y="812" text-anchor="middle" class="label">smp_cpus_done</text>
  <text x="1055" y="836" text-anchor="middle" class="small">RISC-V empty hook</text>

  <path d="M780 225 C840 225, 850 220, 910 220" class="edge-dash"/>
  <path d="M780 627 C845 627, 850 340, 910 340" class="edge"/>
  <path d="M780 627 C845 627, 850 460, 910 460" class="edge"/>
  <path d="M780 627 C845 627, 850 580, 910 580" class="edge-dash"/>
  <path d="M780 480 C845 480, 850 700, 910 700" class="edge-dash"/>
  <path d="M780 748 C845 748, 850 820, 910 820" class="edge-dash"/>
</svg>

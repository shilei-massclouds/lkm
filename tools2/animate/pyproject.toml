[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lkm-tools2-animate"
version = "0.1.0"
description = "Deterministic offline Signal animation stage for tools2."
requires-python = ">=3.11"

[project.scripts]
lkm-animate = "animate_tool.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
